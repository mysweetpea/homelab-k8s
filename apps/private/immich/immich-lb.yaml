# ──────────────────────────────────────────────
# Immich Service (ClusterIP)
# Session 33: Converted from LoadBalancer to ClusterIP — now served via
# Cloudflare tunnel (photos.mysweetpea.cc) through Traefik.
# Selector MUST match the immich-server pod labels:
#   app.kubernetes.io/controller=main
#   app.kubernetes.io/instance=immich
#   app.kubernetes.io/name=server
# ──────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: immich-lb
  namespace: private
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 2283
      targetPort: 2283
      protocol: TCP
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
