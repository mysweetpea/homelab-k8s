# ──────────────────────────────────────────────
# Open WebUI Pipelines — agent pipelines/tools framework
# Open WebUI connects via tool_server.connections (PIPELINES_URL)
# API key from sealed secret pipelines-secret (key PIPELINES_API_KEY)
# ──────────────────────────────────────────────
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/pipelines
          tag: latest
          pullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 9099
            protocol: TCP
        envFrom:
          - secretRef:
              name: pipelines-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.235
    ports:
      http:
        port: 9099
        targetPort: 9099
