apiVersion: v1
kind: ConfigMap
metadata:
  name: decypharr-config
  namespace: private
data:
  config.json: |
    {
      "bind_address": "0.0.0.0",
      "port": "8282",
      "url_base": "",
      "app_url": "http://decypharr.private.svc.cluster.local:8282",
      "log_level": "info",
      "use_auth": true,
      "enable_webdav_auth": false,
      "mount": {
        "type": "none"
      },
      "download_folder": "/data/decypharr-downloads",
      "default_download_action": "strm",
      "folder_naming": "filename",
      "max_active_downloads": 5,
      "debrids": [
        {
          "provider": "realdebrid",
          "name": "RD Primary",
          "api_key": "",
          "download_uncached": false,
          "rate_limit": "250/minute",
          "workers": 25,
          "minimum_free_slot": 0,
          "limit": 100,
          "torrents_refresh_interval": "5m",
          "download_links_refresh_interval": "10m",
          "auto_expire_links_after": "24h",
          "unpack_rar": true
        }
      ],
      "arrs": [
        {
          "name": "Radarr",
          "host": "http://radarr.private.svc.cluster.local:7878",
          "download_uncached": false
        },
        {
          "name": "Sonarr",
          "host": "http://sonarr.private.svc.cluster.local:8989",
          "download_uncached": false
        }
      ],
      "queue_cleanup": {
        "rules": [
          { "id": "failed_download", "action": "blacklist_research" },
          { "id": "title_mismatch", "action": "import" },
          { "id": "no_eligible_files", "action": "blacklist_research" },
          { "id": "file_empty", "action": "blacklist_research" }
        ]
      },
      "repair": {
        "enabled": false
      },
      "usenet": {
        "providers": [
          {
            "host": "news.eweka.nl",
            "port": 563,
            "username": "__EWEKA_USER__",
            "password": "__EWEKA_PASS__",
            "backbone": "Omicron",
            "ssl": true,
            "max_connections": 20,
            "priority": 1
          },
          {
            "host": "news.usenetexpress.com",
            "port": 563,
            "username": "__UEX_USER__",
            "password": "__UEX_PASS__",
            "backbone": "UsenetExpress",
            "ssl": true,
            "max_connections": 10,
            "priority": 2
          }
        ],
        "max_connections": 15,
        "processing_max_connections": 15,
        "read_ahead": "16MB",
        "conn_idle_timeout": "5m",
        "processing_timeout": "10m",
        "availability_sample_percent": 10,
        "import_availability_sample_percent": 1,
        "disk_buffer_path": "/cache/usenet",
        "skip_repair": false
      }
    }
  auth.json: |
    {
      "username": "admin",
      "password": "$2b$10$F1x7Mbk8GeB16iE5a2ggluRLyuPuGDzVwZI8cM/ZF22z4z4Cbehnu"
    }
