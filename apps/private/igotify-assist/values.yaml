controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/androidseb25/igotify-notification-assist
          tag: "v1.6.0.1"
          pullPolicy: IfNotPresent
        env:
          ENABLE_CONSOLE_LOG: "true"
          ENABLE_SCALAR_UI: "false"
          # Pinned-connection mode: the Assist's websocket to Gotify MUST use the
          # internal cluster URL — dialing the public https://gotify.mysweetpea.cc
          # routes out through Cloudflare where Bot Fight Mode 403s the websocket
          # upgrade from a server IP (logs: "403 when 101 expected").
          # Tokens come from the phone's registration (sealed igotify-assist-tokens).
          GOTIFY_URLS:
            valueFrom:
              secretKeyRef:
                name: igotify-assist-tokens
                key: GOTIFY_URLS
          GOTIFY_CLIENT_TOKENS:
            valueFrom:
              secretKeyRef:
                name: igotify-assist-tokens
                key: GOTIFY_CLIENT_TOKENS
          SECNTFY_TOKENS:
            valueFrom:
              secretKeyRef:
                name: igotify-assist-tokens
                key: SECNTFY_TOKENS
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /Health
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /Health
                port: 8080
              initialDelaySeconds: 10
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    globalMounts:
    - path: /app/data