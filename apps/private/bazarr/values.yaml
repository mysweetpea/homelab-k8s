controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/bazarr
          tag: release-v1.6.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    existingClaim: bazarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.20.223"
    allocateLoadBalancerNodePorts: false
    ports:
      http:
        port: 6767
