controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/nzbdav-dev/nzbdav
          tag: 0.6.4
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
    type: deployment
persistence:
  data:
    existingClaim: nzbdav-data-lh
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.212
    ports:
      http:
        port: 8080
        targetPort: 8080
