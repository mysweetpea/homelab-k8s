controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/radarr
          tag: release-6.3.0.10514
    type: deployment
persistence:
  config:
    existingClaim: radarr-lh
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
      - path: /data
service:
  main:
    controller: main
    ports:
      http:
        port: 7878
    type: LoadBalancer
    loadBalancerIP: 192.168.20.218
    allocateLoadBalancerNodePorts: false
