apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd-image-updater.argoproj.io/image-list: ""
    argocd-image-updater.argoproj.io/jellyfin.update-strategy: none
    argocd-image-updater.argoproj.io/jellyfin.update-strategy: semver
    argocd-image-updater.argoproj.io/jellyfin.helm.image-spec: controllers.main.containers.main.image
    # JF12 migration Oct 2026: updater fought the migration (its tag list still
    # served 10.11.11 as latest semver and it "downgraded" 12.1 four times).
    # Disabled until 12.x is verified; re-enable by deleting the two lines below.
    argocd-image-updater.argoproj.io/jellyfin.enabled: "false"
    argocd-image-updater.argoproj.io/write-back-method: none
    argocd-image-updater.argoproj.io/git.repository: git@github.com:mysweetpea/mysweetpea-homelab.git
    argocd-image-updater.argoproj.io/git.branch: main
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:apps/private/jellyfin/values.yaml
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: private
  sources:
  - repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 3.7.3
    helm:
      valueFiles:
      - $values/apps/private/jellyfin/values.yaml
  - repoURL: https://github.com/mysweetpea/mysweetpea-homelab.git
    targetRevision: HEAD
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
