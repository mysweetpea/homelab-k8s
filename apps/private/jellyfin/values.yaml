controllers:
  main:
    containers:
      main:
        image:
          repository: jellyfin/jellyfin
          tag: 10.11.11
        resources:
          requests:
            cpu: 2000m
            memory: 1Gi
          limits:
            cpu: 6000m
            memory: 4Gi
    type: deployment
# Pinned to worker-b: media-storage-lh is RWO (single-node attach)
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-b
persistence:
  cache:
    existingClaim: jellyfin-cache-lh
  config:
    existingClaim: jellyfin-config-lh
  media:
    existingClaim: media-storage-lh
    globalMounts:
      - path: /data
  # Transcodes in RAM (tmpfs) - instant transcode I/O, no Longhorn network round-trips
  transcodes:
    type: emptyDir
    medium: Memory
    sizeLimit: 2Gi
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8096
