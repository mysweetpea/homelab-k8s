n\t\t<link href=\"/_app/immutable/chunks/fQv7DDzW.js\" rel=\"modulepreload\">\n\t\t<link href=\"/_app/immutable/chunks/s3OjpUZ5.js\" rel=\"modulepreload\">\n\t\t<link href=\"/_app/immutable/chunks/FVE7zArq.js\" rel=\"modulepreload\">\n\t\t<link href=\"/_app/immutable/chunks/Bre5lY_g.js\" rel=\"modulepreload\">\n\t\t<link href=\"/_app/immutable/chunks/BfvxFurb.js\" rel=\"modulepreload\">\n\t\t<link href=\"/_app/immutable/chunks/89RotG5n.js\" rel=\"modulepreload\">\n\t\t\n\t\t<link href=\"/_app/immutable/assets/Toaster.DKF17Rty.css\" rel=\"stylesheet\">\n\t\t<link href=\"/_app/immutable/assets/Modal.CSlFhZkq.css\" rel=\"stylesheet\">\n\t\t<link href=\"/_app/immutable/assets/0.D-1LH_Ar.css\" rel=\"stylesheet\">\n\t</head>\n\n\t<body data-sveltekit-preload-data=\"hover\">\n\t\t<div style=\"display: contents\">\n\t\t\t<script>\n\t\t\t\t{\n\t\t\t\t\t__sveltekit_1nlhk8n = {\n\t\t\t\t\t\tbase: \"\"\n\t\t\t\t\t};\n\n\t\t\t\t\tconst element = document.currentScript.parentElement;\n\n\t\t\t\t\tPromise.all([\n\t\t\t\t\t\timport(\"/_app/immutable/entry/start.BcfU-xkP.js\"),\n\t\t\t\t\t\timport(\"/_app/immutable/entry/app.WPjxzi0v.js\")\n\t\t\t\t\t]).then(([kit, app]) => {\n\t\t\t\t\t\tkit.start(app, element);\n\t\t\t\t\t});\n\t\t\t\t}\n\t\t\t</script>\n\t\t</div>\n\n\t\t<div\n\t\t\tid=\"splash-screen\"\n\t\t\tstyle=\"position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%\"\n\t\t>\n\t\t\t<style type=\"text/css\" nonce=\"\">\n\t\t\t\thtml {\n\t\t\t\t\toverflow-y: scroll !important;\n\t\t\t\t}\n\t\t\t</style>\n\n\t\t\t<div\n\t\t\t\tstyle=\"\n\t\t\t\t\tposition: absolute;\n\t\t\t\t\ttop: 33%;\n\t\t\t\t\tleft: 50%;\n\n\t\t\t\t\twidth: 24rem;\n\t\t\t\t\ttransform: translateX(-50%);\n\n\t\t\t\t\tdisplay: flex;\n\t\t\t\t\tflex-direction: column;\n\t\t\t\t\talign-items: center;\n\t\t\t\t\"\n\t\t\t>\n\t\t\t\t<img\n\t\t\t\t\tid=\"logo-her\"\n\t\t\t\t\tstyle=\"width: auto; height: 13rem\"\n\t\t\t\t\tsrc=\"/static/splash.png\"\n\t\t\t\t\tloading=\"eager\"\n\t\t\t\t\tfetchpriority=\"high\"\n\t\t\t\t\tclass=\"animate-pulse-fast\"\n\t\t\t\t/>\n\n\t\t\t\t<div style=\"position: relative; width: 24rem; margin-top: 0.5rem\">\n\t\t\t\t\t<div\n\t\t\t\t\t\tid=\"progress-background\"\n\t\t\t\t\t\tstyle=\"\n\t\t\t\t\t\t\tposition: absolute;\n\t\t\t\t\t\t\twidth: 100%;\n\t\t\t\t\t\t\theight: 0.75rem;\n\n\t\t\t\t\t\t\tborder-radius: 9999px;\n\t\t\t\t\t\t\tbackground-color: #fafafa9a;\n\t\t\t\t\t\t\"\n\t\t\t\t\t></div>\n\n\t\t\t\t\t<div\n\t\t\t\t\t\tid=\"progress-bar\"\n\t\t\t\t\t\tstyle=\"\n\t\t\t\t\t\t\tposition: absolute;\n\t\t\t\t\t\t\twidth: 0%;\n\t\t\t\t\t\t\theight: 0.75rem;\n\t\t\t\t\t\t\tborder-radius: 9999px;\n\t\t\t\t\t\t\tbackground-color: #fff;\n\t\t\t\t\t\t\"\n\t\t\t\t\t\tclass=\"bg-white\"\n\t\t\t\t\t></div>\n\t\t\t\t</div>\n\t\t\t</div>\n\n\t\t\t<!-- <span style=\"position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px\">\n\t\t\t\tFooter content\n\t\t\t</span> -->\n\t\t</div>\n\t<div id=\"mysweetpea-login-disclaimer\" style=\"display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(16,16,16,0.94);color:rgba(255,255,255,0.85);text-align:center;padding:10px 18px;font-family:'Segoe UI','Helvetica Neue',sans-serif;font-size:13px;line-height:1.45;border-top:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(4px);\">Sign in with your MySweetPea account (Authentik SSO). Use the same username and password as Vaultwarden, AFFiNE, and the other services.</div>\n\t<script>\n\t\t(function () {\n\t\t\tfunction hasSession() {\n\t\t\t\ttry { return !!localStorage.getItem('token'); } catch (e) { return false; }\n\t\t\t}\n\t\t\tfunction update() {\n\t\t\t\tvar el = document.getElementById('mysweetpea-login-disclaimer');\n\t\t\t\tif (el) el.style.display = hasSession() ? 'none' : 'block';\n\t\t\t}\n\t\t\tupdate();\n\t\t\tsetInterval(update, 1500);\n\t\t})();\n\t</script>\n\t</body>\n\n\t<style type=\"text/css\" nonce=\"\">\n\t\thtml {\n\t\t\toverflow-y: hidden !important;\n\t\t\toverscroll-behavior-y: none;\n\t\t}\n\n\t\t#splash-screen {\n\t\t\tbackground: #fff;\n\t\t}\n\n\t\thtml.dark #splash-screen {\n\t\t\tbackground: #000;\n\t\t}\n\n\t\thtml.her #splash-screen {\n\t\t\tbackground: #983724;\n\t\t}\n\n\t\t#logo-her {\n\t\t\tdisplay: none;\n\t\t}\n\n\t\t#progress-background {\n\t\t\tdisplay: none;\n\t\t}\n\n\t\t#progress-bar {\n\t\t\tdisplay: none;\n\t\t}\n\n\t\thtml.her #logo {\n\t\t\tdisplay: none;\n\t\t}\n\n\t\thtml.her #logo-her {\n\t\t\tdisplay: block;\n\t\t\tfilter: invert(1);\n\t\t}\n\n\t\thtml.her #progress-background {\n\t\t\tdisplay: block;\n\t\t}\n\n\t\thtml.her #progress-bar {\n\t\t\tdisplay: block;\n\t\t}\n\n\t\t@media (max-width: 24rem) {\n\t\t\thtml.her #progress-background {\n\t\t\t\tdisplay: none;\n\t\t\t}\n\n\t\t\thtml.her #progress-bar {\n\t\t\t\tdisplay: none;\n\t\t\t}\n\t\t}\n\n\t\t@keyframes pulse {\n\t\t\t50% {\n\t\t\t\topacity: 0.65;\n\t\t\t}\n\t\t}\n\n\t\t.animate-pulse-fast {\n\t\t\tanimation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;\n\t\t}\n\t</style>\n</html>\n"
