controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: "v0.11.2"
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        env:
          OLLAMA_BASE_URL: http://ollama.dmz.svc.cluster.local:11434
          WEBUI_PORT: "8080"
          # SSO-only: disable local account creation (Authentik is the only identity source)
          ENABLE_SIGNUP: "false"
        # OIDC via Authentik — client ID/secret injected from secret (not in git)
        envFrom:
        - secretRef:
            name: open-webui-oidc
            # ⚠️ Probes REMOVED (Session 39): v0.11.0 bug — probe traffic deadlocks the
            # event loop ~60s after startup (liveness fails → kubelet SIGKILLs, exit 137).
            # Verified with 6 test pods: no probes = stable 4min+; probes = death at ~110s.
            # Monitored externally by Uptime Kuma (monitor #9).
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8080
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
    - path: /app/backend/data
  web-index:
    type: configMap
    name: open-webui-web-index
    globalMounts:
    - path: /app/build/index.html
      subPath: index.html
      readOnly: true
