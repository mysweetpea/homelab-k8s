controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/doezer/questarr
          tag: "v1.4.2"
    type: deployment

persistence:
  data:
    existingClaim: questarr-data-lh
    globalMounts:
      - path: /app/data

service:
  main:
    controller: main
    ports:
      http:
        port: 5000
