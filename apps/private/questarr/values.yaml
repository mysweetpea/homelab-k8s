controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/doezer/questarr
          tag: "v1.4.2"
    type: deployment

persistence:
  data:
    existingClaim: questarr-data-lh
    globalMounts:
      - path: /app/data

service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.20.227"
    allocateLoadBalancerNodePorts: false
    ports:
      http:
        port: 5000
