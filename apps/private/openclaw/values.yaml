controllers:
  main:
    containers:
      main:
        command:
        - sh
        - -c
        - mkdir -p /data/.openclaw && cp /config/openclaw.json /data/.openclaw/openclaw.json && export HOME=/data && exec node dist/index.js gateway --allow-unconfigured --bind lan --port 8080
        env:
          OPENCLAW_GATEWAY_MODE:
            value: local
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.8.1"
        envFrom:
        - secretRef:
            name: openclaw-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 20
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
    type: deployment
persistence:
  config:
    enabled: true
    name: openclaw-config
    type: configMap
  data:
    enabled: true
    existingClaim: openclaw-data
    type: persistentVolumeClaim
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.217
    ports:
      http:
        port: 8080
