controllers:
  main:
    containers:
      main:
        image:
          repository: gotify/server
          tag: "3.0.0"
          pullPolicy: IfNotPresent
        env:
          GOTIFY_SERVER_PORT: "80"
          GOTIFY_DEFAULTUSER_NAME: "admin"
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 80
              initialDelaySeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 80
              initialDelaySeconds: 10
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 80
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
    - path: /app/data
