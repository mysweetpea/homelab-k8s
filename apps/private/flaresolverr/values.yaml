controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.0
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
    type: deployment
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.214
    ports:
      http:
        port: 8191
