---
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/hotio/qbittorrent
          tag: release-ff687b6
        # WebUI credentials from sealed secret qbittorrent-webui
        # (sealed-secrets/private/qbittorrent-webui.yaml)
        envFrom:
          - secretRef:
              name: qbittorrent-webui
    type: deployment
    # Pinned to worker-b: media-storage-lh is RWO (single-node attach)
    nodeSelector:
      kubernetes.io/hostname: k3s-worker-b
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-storage-lh
    globalMounts:
      - path: /data
service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.20.225"
    allocateLoadBalancerNodePorts: false
    ports:
      http:
        port: 8080

