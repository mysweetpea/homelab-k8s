# ──────────────────────────────────────────────
# Hindsight — agent memory (official vectorize-io helm chart)
# External postgres (shared postgresql-0, DB hindsight + pgvector)
# LLM = Ollama cloud (same key as Nextcloud/Open WebUI)
# ──────────────────────────────────────────────
# version: "0.9.1"

existingSecret: hindsight-secret
api:
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.20.233
  env:
    HINDSIGHT_API_LLM_MODEL: "deepseek-v4-flash:0731"
    HINDSIGHT_API_LLM_BASE_URL: "https://ollama.com/v1"
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 512Mi
  image:
    tag: 0.9.2
    repository: ghcr.io/vectorize-io/hindsight-api
postgresql:
  enabled: false
  external:
    host: postgresql.private.svc.cluster.local
    port: 5432
    database: hindsight
    username: hindsight
worker:
  enabled: false
tei:
  reranker:
    enabled: false
  embedding:
    enabled: false
ingress:
  enabled: false
serviceAccount:
  create: true
