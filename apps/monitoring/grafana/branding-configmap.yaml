data:
  mysweetpea-auth-bg.svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1920\"
    height=\"1080\" viewBox=\"0 0 1920 1080\">\r\n  <defs>\r\n    <radialGradient
    id=\"topGlow\" cx=\"18%\" cy=\"10%\" r=\"75%\">\r\n      <stop offset=\"0%\" stop-color=\"#294149\"/>\r\n
    \     <stop offset=\"48%\" stop-color=\"#14252A\"/>\r\n      <stop offset=\"100%\"
    stop-color=\"#0C1316\"/>\r\n    </radialGradient>\r\n    <radialGradient id=\"sageGlow\"
    cx=\"83%\" cy=\"85%\" r=\"55%\">\r\n      <stop offset=\"0%\" stop-color=\"#8FAFB5\"
    stop-opacity=\".20\"/>\r\n      <stop offset=\"100%\" stop-color=\"#0C1316\" stop-opacity=\"0\"/>\r\n
    \   </radialGradient>\r\n    <filter id=\"noise\">\r\n      <feTurbulence type=\"fractalNoise\"
    baseFrequency=\".8\" numOctaves=\"3\" stitchTiles=\"stitch\"/>\r\n      <feColorMatrix
    type=\"saturate\" values=\"0\"/>\r\n    </filter>\r\n  </defs>\r\n\r\n  <rect
    width=\"1920\" height=\"1080\" fill=\"url(#topGlow)\"/>\r\n  <rect width=\"1920\"
    height=\"1080\" fill=\"url(#sageGlow)\"/>\r\n  <rect width=\"1920\" height=\"1080\"
    filter=\"url(#noise)\" opacity=\".035\"/>\r\n\r\n  <g fill=\"#8FAFB5\" opacity=\".16\">\r\n
    \   <path d=\"M160 205 C95 255 115 365 195 385 C275 365 295 255 230 205 C210 190
    180 190 160 205Z\"/>\r\n    <path d=\"M1690 720 C1615 780 1640 900 1735 918 C1830
    900 1855 780 1780 720 C1755 700 1715 700 1690 720Z\"/>\r\n    <path d=\"M1470
    140 C1425 175 1440 250 1495 264 C1550 250 1565 175 1520 140 C1505 128 1485 128
    1470 140Z\"/>\r\n  </g>\r\n</svg>\r\n"
  mysweetpea-logo.svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600
    600\" width=\"100%\" height=\"100%\">\r\n  <defs>\r\n    <!-- Petal and stem gradients
    (same as v2) -->\r\n    <linearGradient id=\"petal-ice\" x1=\"0%\" y1=\"0%\" x2=\"100%\"
    y2=\"100%\">\r\n      <stop offset=\"0%\" stop-color=\"#EEF2F3\" stop-opacity=\"0.92\"/>\r\n
    \     <stop offset=\"40%\" stop-color=\"#C5D5D8\" stop-opacity=\"0.75\"/>\r\n
    \     <stop offset=\"100%\" stop-color=\"#8FAFB5\" stop-opacity=\"0.55\"/>\r\n
    \   </linearGradient>\r\n\r\n    <linearGradient id=\"petal-frost\" x1=\"100%\"
    y1=\"0%\" x2=\"0%\" y2=\"100%\">\r\n      <stop offset=\"0%\" stop-color=\"#DDE6E8\"
    stop-opacity=\"0.88\"/>\r\n      <stop offset=\"50%\" stop-color=\"#A8C0C8\" stop-opacity=\"0.7\"/>\r\n
    \     <stop offset=\"100%\" stop-color=\"#6B9AA6\" stop-opacity=\"0.5\"/>\r\n
    \   </linearGradient>\r\n\r\n    <linearGradient id=\"keel-glass\" x1=\"0%\" y1=\"0%\"
    x2=\"0%\" y2=\"100%\">\r\n      <stop offset=\"0%\" stop-color=\"#D4E6F1\" stop-opacity=\"0.8\"/>\r\n
    \     <stop offset=\"100%\" stop-color=\"#85929E\" stop-opacity=\"0.5\"/>\r\n
    \   </linearGradient>\r\n\r\n    <linearGradient id=\"stem-nordic\" x1=\"0%\"
    y1=\"0%\" x2=\"0%\" y2=\"100%\">\r\n      <stop offset=\"0%\" stop-color=\"#A3C9B6\"
    stop-opacity=\"0.7\"/>\r\n      <stop offset=\"100%\" stop-color=\"#5D7A6E\" stop-opacity=\"0.9\"/>\r\n
    \   </linearGradient>\r\n\r\n    <linearGradient id=\"vein\" x1=\"0%\" y1=\"0%\"
    x2=\"100%\" y2=\"0%\">\r\n      <stop offset=\"0%\" stop-color=\"#FFFFFF\" stop-opacity=\"0\"/>\r\n
    \     <stop offset=\"50%\" stop-color=\"#FFFFFF\" stop-opacity=\"0.35\"/>\r\n
    \     <stop offset=\"100%\" stop-color=\"#FFFFFF\" stop-opacity=\"0\"/>\r\n    </linearGradient>\r\n\r\n
    \   <!-- Geometric frame gradient -->\r\n    <linearGradient id=\"geo-glass\"
    x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\r\n      <stop offset=\"0%\" stop-color=\"#EEF2F3\"
    stop-opacity=\"0.25\"/>\r\n      <stop offset=\"100%\" stop-color=\"#8FAFB5\"
    stop-opacity=\"0.15\"/>\r\n    </linearGradient>\r\n  </defs>\r\n\r\n  <!-- ====================
    ISLAMIC GEOMETRIC FRAME ==================== -->\r\n  <g transform=\"translate(300,
    300)\" opacity=\"0.7\">\r\n    <!-- Outer 8-pointed star -->\r\n    <polygon points=\"0,-180
    45,-45 180,0 45,45 0,180 -45,45 -180,0 -45,-45\"\r\n             fill=\"none\"
    stroke=\"url(#geo-glass)\" stroke-width=\"1.5\"/>\r\n\r\n    <!-- Inner 8-pointed
    star -->\r\n    <polygon points=\"0,-140 35,-35 140,0 35,35 0,140 -35,35 -140,0
    -35,-35\"\r\n             fill=\"none\" stroke=\"url(#geo-glass)\" stroke-width=\"1\"/>\r\n\r\n
    \   <!-- Interlacing squares -->\r\n    <rect x=\"-125\" y=\"-125\" width=\"250\"
    height=\"250\"\r\n          fill=\"none\" stroke=\"url(#geo-glass)\" stroke-width=\"1\"
    transform=\"rotate(45)\"/>\r\n    <rect x=\"-90\" y=\"-90\" width=\"180\" height=\"180\"\r\n
    \         fill=\"none\" stroke=\"url(#geo-glass)\" stroke-width=\"0.8\" transform=\"rotate(45)\"/>\r\n\r\n
    \   <!-- Radial lines -->\r\n    <g stroke=\"url(#geo-glass)\" stroke-width=\"0.6\"
    opacity=\"0.5\">\r\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-180\"/>\r\n      <line
    x1=\"0\" y1=\"0\" x2=\"127\" y2=\"-127\"/>\r\n      <line x1=\"0\" y1=\"0\" x2=\"180\"
    y2=\"0\"/>\r\n      <line x1=\"0\" y1=\"0\" x2=\"127\" y2=\"127\"/>\r\n      <line
    x1=\"0\" y1=\"0\" x2=\"0\" y2=\"180\"/>\r\n      <line x1=\"0\" y1=\"0\" x2=\"-127\"
    y2=\"127\"/>\r\n      <line x1=\"0\" y1=\"0\" x2=\"-180\" y2=\"0\"/>\r\n      <line
    x1=\"0\" y1=\"0\" x2=\"-127\" y2=\"-127\"/>\r\n    </g>\r\n\r\n    <!-- Center
    octagon -->\r\n    <polygon points=\"0,-70 50,-50 70,0 50,50 0,70 -50,50 -70,0
    -50,-50\"\r\n             fill=\"none\" stroke=\"url(#geo-glass)\" stroke-width=\"1.2\"/>\r\n\r\n
    \   <!-- Corner arabesque arcs -->\r\n    <g stroke=\"url(#geo-glass)\" stroke-width=\"1\"
    fill=\"none\" opacity=\"0.4\">\r\n      <path d=\"M -180 -45 Q -120 -120, -45
    -180\"/>\r\n      <path d=\"M 180 -45 Q 120 -120, 45 -180\"/>\r\n      <path d=\"M
    180 45 Q 120 120, 45 180\"/>\r\n      <path d=\"M -180 45 Q -120 120, -45 180\"/>\r\n
    \   </g>\r\n  </g>\r\n\r\n  <!-- ==================== SWEETPEA (Scaled up, centered)
    ==================== -->\r\n  <g transform=\"translate(300, 300) scale(1.35)\">\r\n
    \   <!-- Stem, leaf, tendril, petals, highlights (same as v2) -->\r\n    <path
    d=\"M 0 85 Q 8 130, -3 170\" stroke=\"url(#stem-nordic)\" stroke-width=\"4\" fill=\"none\"
    stroke-linecap=\"round\"/>\r\n    <path d=\"M -3 140 Q -35 130, -50 155 Q -30
    160, -3 145\" fill=\"#9CBFAE\" opacity=\"0.5\"/>\r\n    <path d=\"M -3 140 Q -35
    130, -50 155\" stroke=\"#B8D4C8\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.7\"/>\r\n
    \   <path d=\"M 0 85 C 25 95, 45 75, 60 90 S 85 115, 75 135\" stroke=\"#C5D5D8\"
    stroke-width=\"2\" fill=\"none\" opacity=\"0.6\"/>\r\n    <path d=\"M 60 90 Q
    68 82, 75 88\" stroke=\"#C5D5D8\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/>\r\n\r\n
    \   <!-- Petals -->\r\n    <path d=\"M -6 65 C -55 45, -80 -15, -35 -35 C -12
    -46, 2 -15, -6 65\" fill=\"url(#petal-ice)\"/>\r\n    <path d=\"M -6 65 C -40
    45, -60 0, -30 -20\" stroke=\"url(#vein)\" stroke-width=\"2.5\" fill=\"none\"
    opacity=\"0.6\"/>\r\n\r\n    <path d=\"M 6 65 C 55 45, 80 -15, 35 -35 C 12 -46,
    -2 -15, 6 65\" fill=\"url(#petal-frost)\"/>\r\n    <path d=\"M 6 65 C 40 45, 60
    0, 30 -20\" stroke=\"url(#vein)\" stroke-width=\"2.5\" fill=\"none\" opacity=\"0.6\"/>\r\n\r\n
    \   <path d=\"M -6 25 C -50 5, -62 -55, -22 -78 C -6 -90, 6 -50, -6 25\" fill=\"url(#petal-frost)\"/>\r\n
    \   <path d=\"M -6 25 C -35 5, -45 -35, -20 -55\" stroke=\"url(#vein)\" stroke-width=\"2\"
    fill=\"none\" opacity=\"0.5\"/>\r\n\r\n    <path d=\"M 6 25 C 50 5, 62 -55, 22
    -78 C 6 -90, -6 -50, 6 25\" fill=\"url(#petal-ice)\"/>\r\n    <path d=\"M 6 25
    C 35 5, 45 -35, 20 -55\" stroke=\"url(#vein)\" stroke-width=\"2\" fill=\"none\"
    opacity=\"0.5\"/>\r\n\r\n    <!-- Keel -->\r\n    <path d=\"M 0 45 C -18 35, -24
    5, 0 -8 C 24 5, 18 35, 0 45\" fill=\"url(#keel-glass)\"/>\r\n    <path d=\"M 0
    45 C -12 35, -16 10, 0 0\" stroke=\"url(#vein)\" stroke-width=\"1.5\" fill=\"none\"
    opacity=\"0.5\"/>\r\n    <path d=\"M 0 45 C 12 35, 16 10, 0 0\" stroke=\"url(#vein)\"
    stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/>\r\n    <path d=\"M 0 -8 L
    0 35\" stroke=\"#D4E6F1\" stroke-width=\"1\" fill=\"none\" opacity=\"0.4\"/>\r\n\r\n
    \   <!-- Highlights -->\r\n    <ellipse cx=\"-28\" cy=\"-8\" rx=\"10\" ry=\"5\"
    fill=\"#FFFFFF\" opacity=\"0.45\" transform=\"rotate(-25)\"/>\r\n    <ellipse
    cx=\"-32\" cy=\"0\" rx=\"4\" ry=\"2\" fill=\"#FFFFFF\" opacity=\"0.3\" transform=\"rotate(-25)\"/>\r\n
    \   <ellipse cx=\"28\" cy=\"-8\" rx=\"10\" ry=\"5\" fill=\"#FFFFFF\" opacity=\"0.4\"
    transform=\"rotate(25)\"/>\r\n    <ellipse cx=\"32\" cy=\"0\" rx=\"4\" ry=\"2\"
    fill=\"#FFFFFF\" opacity=\"0.25\" transform=\"rotate(25)\"/>\r\n    <ellipse cx=\"-18\"
    cy=\"-55\" rx=\"6\" ry=\"12\" fill=\"#FFFFFF\" opacity=\"0.35\"/>\r\n    <path
    d=\"M -22 -60 Q -18 -68, -14 -60\" stroke=\"#FFFFFF\" stroke-width=\"1.5\" fill=\"none\"
    opacity=\"0.4\"/>\r\n    <ellipse cx=\"18\" cy=\"-55\" rx=\"6\" ry=\"12\" fill=\"#FFFFFF\"
    opacity=\"0.3\"/>\r\n    <path d=\"M 14 -60 Q 18 -68, 22 -60\" stroke=\"#FFFFFF\"
    stroke-width=\"1.5\" fill=\"none\" opacity=\"0.35\"/>\r\n    <ellipse cx=\"0\"
    cy=\"18\" rx=\"5\" ry=\"8\" fill=\"#FFFFFF\" opacity=\"0.5\"/>\r\n    <circle
    cx=\"0\" cy=\"8\" r=\"2.5\" fill=\"#FFFFFF\" opacity=\"0.7\"/>\r\n    <path d=\"M
    -20 -70 Q 0 -85, 20 -70\" stroke=\"#FFFFFF\" stroke-width=\"2\" fill=\"none\"
    opacity=\"0.5\" stroke-linecap=\"round\"/>\r\n    <circle cx=\"0\" cy=\"18\" r=\"4\"
    fill=\"#E8F6F3\" opacity=\"0.9\"/>\r\n  </g>\r\n</svg>\r\n"
