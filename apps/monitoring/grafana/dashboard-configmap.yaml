# Grafana provisioned dashboard — cluster logs (loaded by dashboards sidecar)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-cluster-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 25,
                "lineWidth": 1,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [
                "sum"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum by (namespace) (count_over_time({job=~\".+\"}[10m]))",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Log volume by namespace (10m)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 40,
                "lineWidth": 2
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum(count_over_time({job=~\".+\"} | detected_level=\"error\" [5m]))",
              "queryType": "range",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "sum(count_over_time({job=~\".+\"} | detected_level=\"warn\" [5m]))",
              "queryType": "range",
              "refId": "B"
            }
          ],
          "title": "Errors & warnings per minute",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "expr": "{job=~\".+\"} | detected_level=\"error\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Recent error logs (all namespaces)",
          "type": "logs"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": [
        "mysweetpea",
        "loki"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "MySweetPea Cluster Logs",
      "uid": "msp-cluster-logs",
      "version": 1
    }
