# Grafana — dashboards + log exploration (Loki datasource)
# LAN-only via MetalLB (user is the only accessor; Netbird VPN for remote).
# Admin login via sealed secret (no Authentik SSO needed).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  server:
    root_url: http://192.168.20.231:3000
    serve_from_sub_path: false
  auth:
    disable_login_form: false
    disable_signout_menu: false
  auth.basic:
    enabled: true
  users:
    allow_sign_up: false
    auto_assign_org_role: Admin
  log:
    mode: console
    level: info

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000

persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.231
  port: 3000
