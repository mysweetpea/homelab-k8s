# Grafana — dashboards + log exploration (Loki datasource)
# LAN-only via MetalLB (user is the only accessor; Netbird VPN for remote).
# Admin login via sealed secret (no Authentik SSO needed).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
grafana.ini:
  server:
    root_url: http://192.168.20.226:3000
    serve_from_sub_path: false
  auth:
    disable_login_form: false
    disable_signout_menu: false
  auth.basic:
    enabled: true
  users:
    allow_sign_up: false
    auto_assign_org_role: Admin
  log:
    mode: console
    level: info
  smtp:
    enabled: true
    host: smtp.resend.com:587
    user: resend
    # password comes from grafana-smtp sealed secret via GF_SMTP_PASSWORD env
    email_address: grafana@mysweetpea.cc
    from_name: MySweetPea Grafana
    startTLS_policy: OpportunisticStartTLS
    skip_verify: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: true
      jsonData:
        maxLines: 1000
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: gotify
        receivers:
          - uid: gotify-webhook
            type: webhook
            settings:
              url: "http://gotify.private.svc.cluster.local:80/message?token=$__env{GOTIFY_TOKEN}"
              httpMethod: POST
              title: "{{ `{{ template \"default.title\" . }}` }}"
              body: "{{ `{{ template \"default.message\" . }}` }}"
            disableResolveMessage: false
  policies.yaml:
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: gotify
        group_by: ["grafana_folder", "alertname"]
smtp:
  existingSecret: grafana-smtp
  userKey: smtp-user
  passwordKey: smtp-password
envValueFrom:
  GOTIFY_TOKEN:
    secretKeyRef:
      name: grafana-alerting
      key: GOTIFY_TOKEN
persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.226
  port: 3000
image:
  tag: 13.2.0
  repository: grafana/grafana
