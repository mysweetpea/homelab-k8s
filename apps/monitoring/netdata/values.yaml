parent:
  persistence:
    enabled: true
    storageclass: longhorn
    size: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  configs:
    health:
      enabled: true
      path: /etc/netdata/health_alarm_notify.conf
      data: |
        SEND_EMAIL="NO"
        SEND_SLACK="NO"
        SEND_GOTIFY="YES"
        GOTIFY_APP_URL="http://gotify.private.svc.cluster.local:80"
        GOTIFY_APP_TOKEN="gtfya.7WjZ1rhq2h1FMDapkv7nVwZ3N1752-R2qsfmqE0F5xM"
        DEFAULT_RECIPIENT_GOTIFY="alarms"

child:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.229
  port: 19999
