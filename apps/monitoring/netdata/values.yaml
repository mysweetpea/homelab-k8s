parent:
  dnsPolicy: ClusterFirst
  persistence:
    enabled: true
    storageclass: longhorn
    size: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  # Gotify token injected from the netdata-gotify sealed secret (NEVER inline it here —
  # this repo is public; the token was removed from git in the Aug 28 2026 audit).
  envValueFrom:
    GOTIFY_TOKEN:
      secretKeyRef:
        name: netdata-gotify
        key: GOTIFY_TOKEN
  configs:
    health:
      enabled: true
      path: /etc/netdata/health_alarm_notify.conf
      data: |
        SEND_EMAIL="NO"
        SEND_SLACK="NO"
        SEND_GOTIFY="YES"
        GOTIFY_APP_URL="http://gotify.private.svc.cluster.local:80"
        # alarm-notify.sh sources this file as shell — the sealed-secret env var expands here
        GOTIFY_APP_TOKEN="${GOTIFY_TOKEN}"
        DEFAULT_RECIPIENT_GOTIFY="alarms"

child:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

k8sState:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 1m
      memory: 16Mi

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.229
  port: 19999