---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-templates
  namespace: monitoring
data:
  settings.yaml: |
    title: SweetPea Homelab
    description: Your private command center
    headerStyle: boxedWidgets
    theme: dark
    color: slate
    iconStyle: theme
    target: _blank
    fullWidth: true
    disableCollapse: true
    useEqualHeights: true
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    layout:
      Info Widgets:
        tab: 🏠 Home
        header: false
        style: row
        columns: 4
      Public Services:
        tab: 🏠 Home
        icon: mdi-home-circle-outline
        style: row
        columns: 4
      Media:
        tab: 🎬 Media
        icon: mdi-movie-open-outline
        style: row
        columns: 2
      Arr Stack:
        tab: 🎬 Media
        icon: mdi-download-multiple-outline
        style: row
        columns: 4
      Private:
        tab: 🔒 Private
        icon: mdi-lock-outline
        style: row
        columns: 4
      Infrastructure:
        tab: ⚙️ System
        icon: mdi-server-outline
        style: row
        columns: 4
      Monitoring:
        tab: ⚙️ System
        icon: mdi-chart-line
        style: row
        columns: 3
      Coming Soon:
        tab: 🚀 Coming Soon
        icon: mdi-rocket-launch-outline
        style: row
        columns: 4

  bookmarks.yaml: |
    - Quick Links:
        - Homepage:
            - abbr: HP
              href: http://192.168.20.213:3000
        - GitHub:
            - abbr: GH
              href: https://github.com/mysweetpea
        - ArgoCD:
            - abbr: AR
              href: http://192.168.20.220
        - Traefik:
            - abbr: TR
              href: http://192.168.20.210:8080
        - Uptime Kuma:
            - abbr: UK
              href: https://status.mysweetpea.cc
    - Resources:
        - Kubernetes Docs:
            - abbr: K8
              href: https://kubernetes.io/docs/
        - Homepage Docs:
            - abbr: HP
              href: https://gethomepage.dev/
        - Helm Docs:
            - abbr: HL
              href: https://helm.sh/docs/

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |

  widgets.yaml: |
    - resources:
        backend: resources
        cpu: true
        memory: true
        expanded: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
        focus: false

  custom.css: |
    :root {
      --gold: #d4af37;
      --gold-light: #f0c75e;
      --gold-dark: #b8941f;
      --border: rgba(212, 175, 55, 0.22);
      --border-hover: rgba(212, 175, 55, 0.55);
      --bg: #0a0c0e;
      --surface: rgba(16, 18, 21, 0.72);
      --text: #e9e6de;
      --muted: #9d998e;
    }
    html, body, #__next, #page_wrapper, #inner_wrapper, .container {
      background-color: var(--bg) !important;
      background-image: none !important;
      color: var(--text) !important;
    }
    /* Ambient gold glow */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(212, 175, 55, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 12% 90%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 88% 12%, rgba(212, 175, 55, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
      animation: bg-shift 32s ease-in-out infinite;
    }
    @keyframes bg-shift {
      0%, 100% { transform: scale(1); opacity: 1; }
      33% { transform: scale(1.07); opacity: 0.93; }
      66% { transform: scale(1.03); opacity: 0.97; }
    }
    /* Subtle film grain */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.5s steps(10) infinite;
    }
    @keyframes grain {
      0%,100% { transform: translate(0,0); } 10% { transform: translate(-2%,-2%); }
      20% { transform: translate(2%,2%); } 30% { transform: translate(-1%,1%); }
      40% { transform: translate(1%,-1%); } 50% { transform: translate(-2%,2%); }
      60% { transform: translate(2%,-2%); } 70% { transform: translate(-1%,-1%); }
      80% { transform: translate(1%,1%); } 90% { transform: translate(-2%,-1%); }
    }
    #petal-canvas { position: fixed !important; inset: 0 !important; z-index: 1 !important; pointer-events: none !important; }
    .container { position: relative; z-index: 2; padding: 0 22px 40px !important; max-width: 1500px !important; margin: 0 auto !important; }

    /* ---------- HEADER ---------- */
    .header {
      text-align: center !important;
      padding: 32px 20px 4px !important;
      border: none !important;
      background: transparent !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }
    .header h1 {
      font-size: 2.1rem !important;
      font-weight: 800 !important;
      letter-spacing: -0.02em !important;
      margin: 0 !important;
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 45%, var(--gold-dark));
      -webkit-background-clip: text !important;
      background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.22);
    }
    .header p {
      color: var(--muted) !important;
      font-size: 0.95rem !important;
      letter-spacing: 0.04em !important;
      margin: 6px 0 0 !important;
    }

    /* ---------- TABS (visible, pill bar) ---------- */
    #tabs {
      position: sticky !important;
      top: 10px !important;
      z-index: 100 !important;
      display: flex !important;
      justify-content: center !important;
      padding: 8px 12px !important;
      margin: 14px auto 6px !important;
      width: fit-content !important;
      max-width: 100% !important;
      background: rgba(12, 14, 16, 0.78) !important;
      border: 1px solid var(--border) !important;
      border-radius: 999px !important;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45) !important;
      backdrop-filter: blur(16px) !important;
    }
    #tabs ul {
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 2px !important;
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }
    #tabs ul li { margin: 0 !important; }
    #tabs ul li button {
      background: transparent !important;
      border: none !important;
      color: var(--muted) !important;
      font-size: 0.88rem !important;
      font-weight: 600 !important;
      padding: 9px 20px !important;
      border-radius: 999px !important;
      cursor: pointer !important;
      transition: all 0.22s ease !important;
      letter-spacing: 0.02em !important;
      white-space: nowrap !important;
    }
    #tabs ul li button:hover {
      color: var(--gold-light) !important;
      background: rgba(212, 175, 55, 0.09) !important;
    }
    #tabs ul li button[aria-selected="true"],
    #tabs ul li button.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.12)) !important;
      color: var(--gold-light) !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.2), inset 0 0 0 1px rgba(212, 175, 55, 0.3) !important;
    }

    /* ---------- SEARCH ---------- */
    #quicklaunch, .quicklaunch {
      margin: 8px auto 12px !important;
      max-width: 620px !important;
      width: 100% !important;
    }
    #quicklaunch input, .quicklaunch input, input[type="search"] {
      background: rgba(14, 16, 18, 0.82) !important;
      border: 1px solid var(--border) !important;
      border-radius: 999px !important;
      color: var(--text) !important;
      padding: 11px 22px !important;
      font-size: 0.95rem !important;
      outline: none !important;
      transition: border-color 0.25s ease, box-shadow 0.25s ease !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
    }
    #quicklaunch input:focus, .quicklaunch input:focus, input[type="search"]:focus {
      border-color: var(--border-hover) !important;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12), 0 4px 20px rgba(0, 0, 0, 0.35) !important;
    }

    /* ---------- INFO WIDGETS ---------- */
    #information-widgets {
      position: relative !important;
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 12px !important;
      justify-content: center !important;
      padding: 12px 0 2px !important;
      background: transparent !important;
      border: none !important;
    }
    #information-widgets .widget, #information-widgets .info-widget {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 14px !important;
      backdrop-filter: blur(10px) !important;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3) !important;
    }

    /* ---------- SERVICE GROUPS & CARDS ---------- */
    .service-group { margin: 20px 0 6px !important; }
    .service-group-name {
      color: var(--gold-dark) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.09em !important;
      font-size: 0.78rem !important;
      margin-bottom: 12px !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }
    .service-group-name::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(to right, rgba(212, 175, 55, 0.35), transparent);
    }
    .service-card {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 14px !important;
      backdrop-filter: blur(10px) !important;
      transition: all 0.25s ease !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25) !important;
    }
    .service-card:hover {
      transform: translateY(-4px) !important;
      border-color: var(--border-hover) !important;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), 0 0 26px rgba(212, 175, 55, 0.14) !important;
      background: rgba(20, 22, 24, 0.85) !important;
    }
    .service-card .name { color: var(--text) !important; font-weight: 600 !important; }
    .service-card .description { color: var(--muted) !important; font-size: 0.82rem !important; }

    /* ---------- BOOKMARKS ---------- */
    .bookmark-group { margin: 18px 0 !important; }
    .bookmark-group .bookmark-title {
      color: var(--gold-dark) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.09em !important;
      font-size: 0.78rem !important;
    }
    .bookmark-group .bookmark {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      transition: all 0.25s ease !important;
    }
    .bookmark-group .bookmark:hover {
      border-color: var(--border-hover) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
    }

    /* ---------- FOOTER ---------- */
    #footer, .footer {
      border-top: 1px solid rgba(212, 175, 55, 0.15) !important;
      margin-top: 34px !important;
      padding: 18px 0 8px !important;
      color: var(--muted) !important;
      font-size: 0.8rem !important;
      text-align: center !important;
    }

    /* ---------- REMOVE LEGACY BRANCH OVERLAY ---------- */
    #branch-overlay, #branch-content, #branch-vines, #branch-center, #branch-logo,
    .branch-btn-wrapper, .branch-btn, .branch-btn-vine, #back-btn, .vine-leaf, .branch-line, .branch-tendril {
      display: none !important;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .header { padding: 22px 14px 2px !important; }
      .header h1 { font-size: 1.6rem !important; }
      #tabs { top: 6px !important; border-radius: 20px !important; }
      #tabs ul li button { padding: 8px 14px !important; font-size: 0.82rem !important; }
      .container { padding: 0 14px 30px !important; }
    }

  custom.js: |
    console.log("SWEETPEA CUSTOM JS: file loaded");

    (function() {
      "use strict";
      var initialized = false;
      function log(msg) { console.log("[SweetPea Homepage]", msg); }

      function init() {
        if (initialized) return;
        initialized = true;
        log("Starting initialization");
        try {
          var header = document.querySelector(".header");
          if (header) header.style.display = "";

          // Clean up any legacy branch overlay artifacts
          var overlay = document.getElementById("branch-overlay");
          if (overlay) overlay.remove();
          var backBtn = document.getElementById("back-btn");
          if (backBtn) backBtn.remove();
          document.body.classList.remove("service-active");

          // Ambient falling petals (subtle)
          var canvas = document.createElement("canvas");
          canvas.id = "petal-canvas";
          document.body.prepend(canvas);
          var ctx = canvas.getContext("2d");
          function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
          resizeCanvas();
          window.addEventListener("resize", resizeCanvas);

          var petals = [];
          var count = Math.min(70, Math.max(35, Math.floor((canvas.width * canvas.height) / 45000)));
          for (var i = 0; i < count; i++) {
            petals.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              size: Math.random() * 7 + 4,
              speedY: Math.random() * 0.7 + 0.25,
              speedX: (Math.random() - 0.5) * 0.4,
              rotation: Math.random() * Math.PI * 2,
              rotationSpeed: (Math.random() - 0.5) * 0.02,
              opacity: Math.random() * 0.28 + 0.1,
              sway: Math.random() * 0.015 + 0.004,
              swayOffset: Math.random() * Math.PI * 2
            });
          }
          log("Created " + count + " petals");

          var frame = 0;
          function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frame++;
            for (var i = 0; i < petals.length; i++) {
              var p = petals[i];
              p.y += p.speedY;
              p.x += p.speedX + Math.sin(frame * p.sway + p.swayOffset) * 0.4;
              p.rotation += p.rotationSpeed;
              if (p.y > canvas.height + 30) { p.y = -30; p.x = Math.random() * canvas.width; }
              if (p.x < -30) p.x = canvas.width + 30;
              if (p.x > canvas.width + 30) p.x = -30;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.globalAlpha = p.opacity;
              var grad = ctx.createLinearGradient(-p.size, -p.size, p.size, p.size);
              grad.addColorStop(0, "#f0c75e");
              grad.addColorStop(0.5, "#d4af37");
              grad.addColorStop(1, "#b8941f");
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(0, -p.size);
              ctx.bezierCurveTo(p.size * 0.7, -p.size * 0.4, p.size * 0.7, p.size * 0.4, 0, p.size);
              ctx.bezierCurveTo(-p.size * 0.7, p.size * 0.4, -p.size * 0.7, -p.size * 0.4, 0, -p.size);
              ctx.fill();
              ctx.restore();
            }
            requestAnimationFrame(animatePetals);
          }
          animatePetals();

          log("Initialization complete");
        } catch (err) {
          console.error("SWEETPEA CUSTOM JS ERROR:", err);
        }
      }

      if (document.readyState === "complete") {
        init();
      } else {
        window.addEventListener("load", init);
      }
    })();

