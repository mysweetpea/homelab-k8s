# Glances — system monitoring for the homepage glances widget
# Manual apply (no ArgoCD app; monitoring ns):
#   kubectl apply -f apps/monitoring/homepage/glances.yaml
# The homepage glances widget points at http://glances.monitoring.svc.cluster.local:61208
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances
  namespace: monitoring
  labels:
    app.kubernetes.io/name: glances
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glances
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glances
    spec:
      containers:
      - name: glances
        image: nicolargo/glances:latest
        # NOTE: the image entrypoint does NOT append args — must set command explicitly
        # Auth: -u <user> reads <config_dir>/<user>.pwd (pbkdf2_hmac sha256 salt$hash)
        command: ["glances"]
        args: ["-w", "--port", "61208", "-u", "sweetpea"]
        env:
        - name: GLANCES_USERNAME
          valueFrom:
            secretKeyRef:
              name: glances-auth
              key: GLANCES_USERNAME
        - name: GLANCES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glances-auth
              key: GLANCES_PASSWORD
        volumeMounts:
        - name: glances-pwd
          mountPath: /root/.config/glances/sweetpea.pwd
          subPath: sweetpea.pwd
          readOnly: true
        ports:
        - containerPort: 61208
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      volumes:
      - name: glances-pwd
        secret:
          secretName: glances-auth
          items:
          - key: sweetpea.pwd
            path: sweetpea.pwd
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: glances
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: glances
  ports:
  - port: 61208
    targetPort: 61208
    name: http
