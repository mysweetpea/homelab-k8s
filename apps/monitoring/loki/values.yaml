# Loki — log aggregation (single binary, small footprint)
# NOTE: deploymentMode/singleBinary/backend/read/write/persistence/resources/
# service/gateway/test/monitoring/lokiCanary are TOP-LEVEL chart values.
loki:
  image:
    repository: grafana/loki
    tag: "3.4.2"
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-08-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_retain_period: 1m
    lifecycler:
      ring:
        kvstore:
          store: inmemory
  limits_config:
    retention_period: 14d
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 4
  pattern_ingester:
    enabled: true

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
# Zero out the SimpleScalable targets (chart defaults them to 3 even in
# SingleBinary mode, which trips the "no object storage" validation)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 256Mi

service:
  type: ClusterIP
  port: 3100

gateway:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

lokiCanary:
  enabled: false
