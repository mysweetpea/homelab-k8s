---
# Uptime Kuma — status.mysweetpea.cc
# Tunnel routes status.mysweetpea.cc -> Traefik (192.168.20.210:80)
# This IngressRoute sends it to the uptime-kuma service in monitoring.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`status.mysweetpea.cc`)
      kind: Rule
      middlewares:
        - name: uptime-kuma-cors
      services:
        - name: uptime-kuma
          port: 3001
