config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# ImageUpdater CR — v1.x controller is CR-driven. useAnnotations: true reads
# each app's per-app annotations (image-list, update-strategy, allow-tags).
# Per-app writeBackConfig.writeBackTarget = helmvalues:<values.yaml path> makes
# tag updates commit DIRECTLY into the app's values.yaml (which the $values ref
# picks up → ArgoCD syncs → rollout). Replaces the broken setup that wrote
# .argocd-source-*.yaml overrides (ignored for multi-source apps).
extraObjects:
  - |
    apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: homelab-image-updater
      namespace: argocd
    spec:
      applicationRefs:
      - namePattern: affine
        useAnnotations: true
        writeBackConfig:
          method: git:secret:argocd/argocd-image-updater-git-ssh
          gitConfig:
            repository: git@github.com:mysweetpea/homelab-k8s.git
            branch: main
            writeBackTarget: helmvalues:apps/dmz/affine/values.yaml
      - namePattern: aiostreams
        useAnnotations: true
        writeBackConfig:
          method: git:secret:argocd/argocd-image-updater-git-ssh
