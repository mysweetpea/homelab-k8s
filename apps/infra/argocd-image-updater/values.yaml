config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# NOTE: NO ImageUpdater CR — annotation-only mode is PROVEN WORKING
# (auto-update commits Aug 11-13: n8n, cloudflared, seerr, gotify).
# The CR (added 2026-08-13 21:24) broke write-back: "could not get creds
# for repo 'https://bjw-s-labs.github.io/helm-charts'" on 11 apps even with
# per-app gitConfig + git.repository annotations. Each app carries:
#   argocd-image-updater.argoproj.io/write-back-method: git
#   argocd-image-updater.argoproj.io/write-back-target: helmvalues:<path>
#   argocd-image-updater.argoproj.io/git.repository: git@github.com:mysweetpea/homelab-k8s.git
#   argocd-image-updater.argoproj.io/git.branch: main
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
