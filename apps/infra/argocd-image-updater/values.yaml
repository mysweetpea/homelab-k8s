config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# NOTE: No ImageUpdater CR here. The CR wrote .argocd-source-<app>.yaml
# override files, which ArgoCD IGNORES for multi-source apps (sources[] +
# $values ref) — commits landed in git but nothing ever applied, and the
# controller re-committed every 2 min forever.
# Annotation mode (per-app: write-back-method: git + write-back-target:
# helmvalues) writes the tag DIRECTLY into apps/*/values.yaml, which the
# $values ref picks up → ArgoCD syncs → rollout happens. All 29 apps already
# carry those annotations.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
