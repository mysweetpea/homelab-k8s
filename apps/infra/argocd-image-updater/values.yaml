config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# ImageUpdater CR — v1.2.1 controller is CR-driven.
# CRITICAL (Session 41, Aug 14 2026): each app needs BOTH
#   - images[].manifestTargets.helm.tag = <values.yaml tag path>  (where to write)
#   - writeBackConfig.gitConfig.writeBackTarget = helmvalues:<values.yaml path> (which file)
# The earlier "proven" state had manifestTargets but NO writeBackTarget → the
# controller wrote .argocd-source-*.yaml overrides, which ArgoCD IGNORES for
# multi-source apps (sources[] + $values) → commits landed in git but no
# rollouts ever happened (live images stayed old: gotify 2.6.1, n8n 2.33.6).
# The SSH key secret must be named `ssh-git-creds` (chart default mount
# /app/ssh-keys/id_rsa, subPath sshPrivateKey) — the old name
# `argocd-image-updater-git-ssh` was never mounted → silent fallback to
# live-spec updates (reverted by selfHeal).
extraObjects:
  - |
    apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: homelab-image-updater
      namespace: argocd
    spec:
      writeBackConfig:
        method: git:secret:argocd/ssh-git-creds
        gitConfig:
          repository: git@github.com:mysweetpea/homelab-k8s.git
          branch: main
      applicationRefs:
        - namePattern: n8n
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/private/n8n/values.yaml
          images:
            - alias: n8n
              imageName: n8nio/n8n
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^2\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: immich
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/private/immich/values.yaml
          images:
            - alias: immich
              imageName: ghcr.io/immich-app/immich-server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: homepage
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/monitoring/homepage/values.yaml
          images:
            - alias: homepage
              imageName: ghcr.io/gethomepage/homepage
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: jellyfin
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/jellyfin/values.yaml
          images:
            - alias: jellyfin
              imageName: jellyfin/jellyfin
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: authentik
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/authentik/values.yaml
          images:
            - alias: authentik
              imageName: ghcr.io/goauthentik/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: nextcloud
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/private/nextcloud/values.yaml
          images:
            - alias: nextcloud
              imageName: ghcr.io/nextcloud/nextcloud
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: vaultwarden
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/vaultwarden/values.yaml
          images:
            - alias: vaultwarden
              imageName: vaultwarden/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: open-webui
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/private/open-webui/values.yaml
          images:
            - alias: open-webui
              imageName: ghcr.io/open-webui/open-webui
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: cloudflared
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/dmz/cloudflared/values.yaml
          images:
            - alias: cloudflared
              imageName: cloudflare/cloudflared
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d{4}\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: gotify
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/private/gotify/values.yaml
          images:
            - alias: gotify
              imageName: gotify/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: uptime-kuma
          writeBackConfig:
            gitConfig:
              writeBackTarget: helmvalues:apps/monitoring/uptime-kuma/values.yaml
          images:
            - alias: uptime-kuma
              imageName: louislam/uptime-kuma
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
