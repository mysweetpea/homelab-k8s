config:
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
  log:
    level: info
  git:
    user: "argocd-image-updater"
    email: "argocd-image-updater@mysweetpea.cc"
  registries:
    - name: GHCR
      prefix: ghcr.io
      api_url: https://ghcr.io
      credentials: pullsecret:argocd/ghcr-credentials
extraArgs:
  - --registries-conf-path
  - /app/config/registries.conf
# Wire the orphaned ImageUpdater CR into the chart (Phase 2).
# The CRD is installed by the chart; this renders the ImageUpdater object
# so the controller actually processes it. SSH write-back uses the sealed
# argocd-image-updater-git-ssh key (git@github.com:mysweetpea/homelab-k8s.git).
extraObjects:
  - |
    apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: homelab-image-updater
      namespace: argocd
    spec:
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-git-ssh
        gitConfig:
          repository: git@github.com:mysweetpea/homelab-k8s.git
          branch: main
      applicationRefs:
        - namePattern: n8n
          images:
            - alias: n8n
              imageName: n8nio/n8n
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^2\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: immich
          images:
            - alias: immich
              imageName: ghcr.io/immich-app/immich-server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: homepage
          images:
            - alias: homepage
              imageName: ghcr.io/gethomepage/homepage
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: jellyfin
          images:
            - alias: jellyfin
              imageName: jellyfin/jellyfin
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: authentik
          images:
            - alias: authentik
              imageName: ghcr.io/goauthentik/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^20\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: authentik.image.tag
        - namePattern: nextcloud
          images:
            - alias: nextcloud
              imageName: docker.io/nextcloud
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: image.tag
        - namePattern: vaultwarden
          images:
            - alias: vaultwarden
              imageName: ghcr.io/dani-garcia/vaultwarden
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^1\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: open-webui
          images:
            - alias: openwebui
              imageName: ghcr.io/open-webui/open-webui
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^v\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: cloudflared
          images:
            - alias: cloudflared
              imageName: cloudflare/cloudflared
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^2026\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: gotify
          images:
            - alias: gotify
              imageName: gotify/server
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^2\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
        - namePattern: uptime-kuma
          images:
            - alias: uptimekuma
              imageName: docker.io/louislam/uptime-kuma
              commonUpdateSettings:
                updateStrategy: semver
                allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
              manifestTargets:
                helm:
                  tag: controllers.main.containers.main.image.tag
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
