apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/mysweetpea/homelab-k8s.git
    path: apps/infra/network-policies
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
