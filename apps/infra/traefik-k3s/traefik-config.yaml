---
# k3s-native Traefik config override — applied by k3s (survives upgrades).
# Lives on master at /var/lib/rancher/k3s/server/manifests/traefik-config.yaml.
# Chart schema verified against bundled traefik-39.0.701+up39.0.7.tgz:
#   resources (top-level), logs.access.enabled, additionalArguments (top-level)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    logs:
      access:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # GHSA-rf44-j88r-hh8c: drop dot/underscore-aliased duplicate headers on both
    # public entrypoints (ForwardAuth identity-spoofing fix, opt-in).
    additionalArguments:
      - "--entryPoints.web.http.aliasHeadersStrategy=delete"
      - "--entryPoints.websecure.http.aliasHeadersStrategy=delete"
