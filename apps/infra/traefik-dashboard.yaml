# Traefik Dashboard + API — basic auth middleware + IngressRoute
# Manual apply (k3s-managed Traefik, no ArgoCD app for kube-system):
#   kubectl apply -f apps/infra/traefik-dashboard.yaml
#   kubectl apply -f sealed-secrets/kube-system/traefik-dashboard-auth.yaml
#
# SECURITY (audit Aug 28 2026): the basic-auth Secret now ships SEALED
# (sealed-secrets/kube-system/traefik-dashboard-auth.yaml) — the plaintext
# form previously committed here has been removed. The dashboard password
# is the same one the Homepage traefik widget uses (stored in the
# homepage-secrets sealed secret, key TRAEFIK_PASSWORD).
# NOTE: this Middleware/IR pair is NOT ArgoCD-managed (kube-system) — the
# tracking-id annotation on the sealed secret is informational only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: kube-system
spec:
  basicAuth:
    secret: traefik-dashboard-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - traefik
  routes:
    - match: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      kind: Rule
      middlewares:
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService