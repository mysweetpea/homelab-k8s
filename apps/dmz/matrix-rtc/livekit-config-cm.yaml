apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: dmz
  labels:
    app.kubernetes.io/name: livekit
data:
  config.yaml: |
    # LiveKit config template — keys/webhook key are substituted by the init
    # container from the matrix-rtc-livekit sealed secret (never in git).
    # Media path: LAN clients → host candidate 192.168.20.40 (hostNetwork);
    # internet clients → external TURN relay on VPS (129.213.11.104:3478).
    port: 7880
    keys:
      __API_KEY__: __API_SECRET__
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 60000
      use_external_ip: false
      advertise_internal_ip: true
      # External TURN relay on the VPS (coturn at media.mysweetpea.cc) —
      # internet clients relay media through it; LAN clients connect directly
      # via host candidate. Shared secret (TURN_SECRET) substituted by init.
      turn_servers:
      - host: media.mysweetpea.cc
        port: 5349
        protocol: tls
        secret: __TURN_SECRET__
        ttl: 14400
      - host: media.mysweetpea.cc
        port: 3478
        protocol: udp
        secret: __TURN_SECRET__
        ttl: 14400
    room:
      # Room creation is authorized by lk-jwt-service (full-access users only)
      auto_create: false
    webhook:
      api_key: __WEBHOOK_KEY__
      urls:
      - https://matrix-rtc.mysweetpea.cc/livekit/jwt/sfu_webhook
    logging:
      level: info
