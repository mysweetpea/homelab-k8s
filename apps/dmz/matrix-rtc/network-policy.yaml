---
# Egress for the MatrixRTC Authorization Service (lk-jwt):
# - OpenID token validation → Synapse (8008)
# - LiveKit JWT issue → LiveKit SFU on hostNetwork (192.168.20.40:7880)
# DNS is already allowed by allow-dns-egress (namespace-wide).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-matrix-rtc-auth-egress
  namespace: dmz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-rtc-auth
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-synapse
          app.kubernetes.io/component: synapse
    ports:
    - port: 8008
      protocol: TCP
  # LiveKit SFU via ClusterIP service (10.43.0.0/16 — pre-DNAT destination)
  # and directly via the hostNetwork IP (192.168.20.40)
  - to:
    - ipBlock:
        cidr: 10.43.0.0/16
    - ipBlock:
        cidr: 192.168.20.40/32
    ports:
    - port: 7880
      protocol: TCP
