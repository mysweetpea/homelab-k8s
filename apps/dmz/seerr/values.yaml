controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.4.1
        command:
          - sh
          - -c
          - node /app/config/patch.js && cd /app && node dist/index.js
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    pod:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: k3s-master
    type: deployment
persistence:
  config:
    accessMode: ReadWriteOnce
    enabled: true
    globalMounts:
    - path: /app/config
    size: 5Gi
    storageClass: longhorn
    type: persistentVolumeClaim
  patch:
    enabled: true
    type: configMap
    name: seerr-patch
    globalMounts:
    - path: /app/config/patch.js
      subPath: patch.js
      readOnly: true
service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 5055
