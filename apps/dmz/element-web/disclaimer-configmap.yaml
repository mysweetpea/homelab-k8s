apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-disclaimer
  namespace: dmz
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: homelab
data:
  index.html: "<!doctype html>\n<html lang=\"en\" style=\"height: 100%;\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Element</title>\n    <link rel=\"apple-touch-icon\" sizes=\"120x120\" href=\"vector-icons/120.570a7f9.png\">\n    <link rel=\"apple-touch-icon\" sizes=\"144x144\" href=\"vector-icons/144.5a63bf2.png\">\n    <link rel=\"apple-touch-icon\" sizes=\"152x152\" href=\"vector-icons/152.1ccdc8a.png\">\n    <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"vector-icons/180.30b915f.png\">\n    <link rel=\"manifest\" href=\"manifest.json\">\n    <meta name=\"referrer\" content=\"no-referrer\">\n    <link rel=\"icon\" type=\"image/png\" sizes=\"24x24\" href=\"vector-icons/24.97ab000.png\">\n    <link rel=\"icon\" type=\"image/png\" sizes=\"144x144\" href=\"vector-icons/144.5a63bf2.png\">\n    <link rel=\"icon\" type=\"image/png\" sizes=\"512x512\" href=\"vector-icons/512.7ce350d.png\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <meta name=\"apple-mobile-web-app-title\" content=\"Element\">\n    <meta name=\"application-name\" content=\"Element\">\n    <meta name=\"theme-color\" content=\"#ffffff\">\n    <meta property=\"og:image\" content=\"https://app.element.io/themes/element/img/logos/opengraph.png\" />\n    <meta http-equiv=\"Content-Security-Policy\" content=\"\n        default-src 'none';\n        style-src 'self' 'unsafe-inline' ;\n        script-src 'self' 'wasm-unsafe-eval' https://www.recaptcha.net/recaptcha/ https://www.gstatic.com/recaptcha/ ;\n        img-src * blob: data:;\n        connect-src * blob:;\n        font-src 'self' data: ;\n        media-src * blob: data:;\n        child-src * blob: data:;\n        worker-src 'self' blob: ;\n        frame-src * blob: data:;\n        form-action 'self' ;\n        manifest-src 'self' ;\n    \">\n    \n           <link rel=\"stylesheet\" href=\"bundles/7ee5b2a0faf6bd7fa132/bundle.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Legacy-light\" title=\"Legacy-light\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-legacy-light.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Legacy-dark\" title=\"Legacy-dark\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-legacy-dark.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Light\" title=\"Light\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-light.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Light-high-contrast\" title=\"Light-high-contrast\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-light-high-contrast.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Dark\" title=\"Dark\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-dark.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Light-custom\" title=\"Light-custom\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-light-custom.css\">\n        \n           <link rel=\"stylesheet\" disabled=\"disabled\" data-mx-theme=\"Dark-custom\" title=\"Dark-custom\" href=\"bundles/7ee5b2a0faf6bd7fa132/theme-dark-custom.css\">\n        \n\n    \n\n  </head>\n  <body style=\"height: 100%; margin: 0;\">\n    <noscript>Sorry, Element requires JavaScript to be enabled.</noscript> <!-- TODO: Translate this? -->\n    <div id=\"matrixchat\" style=\"height: 100%;\" class=\"notranslate\"></div>\n\n    <script src=\"bundles/7ee5b2a0faf6bd7fa132/bundle.js\"></script>\n    <script src=\"disclaimer.js\"></script>\n\n\n    <!-- Legacy supporting Prefetch images -->\n    <img src=\"\" aria-hidden alt=\"\" width=\"24\" height=\"23\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n    <img src=\"\" aria-hidden alt=\"\" width=\"25\" height=\"22\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n    <img src=\"\" aria-hidden alt=\"\" width=\"25\" height=\"22\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n    <img src=\"\" aria-hidden alt=\"\" width=\"25\" height=\"22\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n    <img src=\"\" aria-hidden alt=\"\" width=\"25\" height=\"22\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n    <img src=\"\" aria-hidden alt=\"\" width=\"25\" height=\"22\" style=\"visibility: hidden; position: absolute; top: 0px; left: 0px;\"/>\n\n    <!-- let CSS themes pass constants to the app -->\n    <div id=\"mx_theme_accentColor\"></div><div id=\"mx_theme_secondaryAccentColor\"></div><div id=\"mx_theme_tertiaryAccentColor\"></div>\n\n    <!-- We eagerly create these containers to ensure their CSS stacking context order is sensible -->\n    <div id=\"mx_PersistedElement_container\"></div>\n    <div id=\"mx_Dialog_StaticContainer\"></div>\n    <div id=\"mx_Dialog_Container\"></div>\n    <div id=\"mx_ContextualMenu_Container\"></div>\n  </body>\n</html>\n"
  disclaimer.js: "// MySweetPea login disclaimer (injected Aug 2026)\n(function () {\n  function hasSession() {\n    try {\n      for (var i = 0; i < localStorage.length; i++) {\n        var k = localStorage.key(i) || '';\n        if (k.indexOf('mx_access_token') !== -1) return true;\n      }\n    } catch (e) {}\n    return false;\n  }\n  function addBanner() {\n    if (document.getElementById('mysweetpea-login-disclaimer')) return;\n    var el = document.createElement('div');\n    el.id = 'mysweetpea-login-disclaimer';\n    el.style.cssText =\n      'display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(16,16,16,0.94);color:rgba(255,255,255,0.85);text-align:center;padding:10px 18px;font-family:\\'Segoe UI\\',\\'Helvetica Neue\\',sans-serif;font-size:13px;line-height:1.45;border-top:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(4px);';\n    el.textContent =\n      'Sign in with your MySweetPea account (Authentik SSO). Use the same username and password as Vaultwarden, AFFiNE, and the other services.';\n    document.body.appendChild(el);\n  }\n  function update() {\n    var el = document.getElementById('mysweetpea-login-disclaimer');\n    if (!el) addBanner();\n    el = document.getElementById('mysweetpea-login-disclaimer');\n    if (el) el.style.display = hasSession() ? 'none' : 'block';\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', update);\n  } else {\n    update();\n  }\n  setInterval(update, 1500);\n})();\n"
