apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-home
  namespace: dmz
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: homelab
data:
  home.html: |-
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>MySweetPea Chat</title>
      <style>
        :root {
          --bg: #0C1316;
          --surface: #1B2B31;
          --teal: #5EB8A8;
          --teal-soft: #7ECFC0;
          --text: #F2F6F4;
          --muted: #9FB4AE;
          --border: rgba(94, 184, 168, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
          background: var(--bg);
          color: var(--text);
          font-family: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
          display: flex; align-items: center; justify-content: center;
          min-height: 100vh;
          background-image:
            radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94, 184, 168, 0.14), transparent),
            radial-gradient(ellipse 60% 40% at 85% 110%, rgba(94, 184, 168, 0.08), transparent);
        }
        .card {
          max-width: 560px; width: 92%;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 48px 40px 40px;
          text-align: center;
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }
        .logo { width: 96px; height: 96px; margin: 0 auto 24px; display: block; }
        h1 {
          font-family: "Fraunces", Georgia, serif;
          font-weight: 600; font-size: 2.1rem; letter-spacing: -0.01em;
          margin-bottom: 10px;
        }
        .tagline { color: var(--muted); font-size: 1.02rem; line-height: 1.6; margin-bottom: 32px; }
        .tagline strong { color: var(--teal); font-weight: 600; }
        .btn {
          display: inline-block;
          background: var(--teal); color: #0C1316;
          font-weight: 600; font-size: 1rem;
          padding: 13px 34px; border-radius: 999px;
          text-decoration: none; letter-spacing: 0.01em;
          transition: background 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--teal-soft); transform: translateY(-1px); }
        .features {
          display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
          margin-top: 34px;
        }
        .feature {
          font-size: 0.78rem; color: var(--muted);
          border: 1px solid var(--border); border-radius: 999px;
          padding: 6px 14px; background: rgba(94, 184, 168, 0.06);
        }
        .footer { margin-top: 30px; font-size: 0.78rem; color: var(--muted); }
        .footer a { color: var(--teal); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
      </style>
    </head>
    <body>
      <div class="card">
        <img class="logo" src="https://mysweetpea.cc/logo.svg" alt="MySweetPea">
        <h1>MySweetPea Chat</h1>
        <p class="tagline">
          Private, end-to-end encrypted messaging for the MySweetPea family.
          <strong>Your conversations stay yours.</strong>
        </p>
        <a class="btn" href="#/login">Sign in</a>
        <div class="features">
          <span class="feature">🔒 End-to-end encrypted</span>
          <span class="feature">📞 Voice &amp; video calls</span>
          <span class="feature">🖼️ URL previews</span>
          <span class="feature">📧 Email notifications</span>
        </div>
        <div class="footer">
          <a href="https://mysweetpea.cc">mysweetpea.cc</a> &nbsp;·&nbsp;
          <a href="https://mysweetpea.cc/services.html">Services</a> &nbsp;·&nbsp;
          <a href="https://mysweetpea.cc/support.html">Support</a>
        </div>
      </div>
    </body>
    </html>
