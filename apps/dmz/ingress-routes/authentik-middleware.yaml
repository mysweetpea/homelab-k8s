---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-https-headers
  namespace: dmz
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      X-Forwarded-Ssl: "on"

---
# Authentik never sends Cache-Control on its HTML shells (index/if/flow).
# Without it, browsers heuristic-cache the shell; after an image bump the
# cached shell references old versioned assets -> 404 -> infinite spinner.
# no-cache forces revalidation (ETag/Last-Modified) while still allowing 304s.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-no-cache-html
  namespace: dmz
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "no-cache, must-revalidate"
