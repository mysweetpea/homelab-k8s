---
# Rate-limit the SSO front door (defense-in-depth beneath the Cloudflare edge rule).
# avg 30 req/10s per source IP with burst 120 — sized for a COLD page load:
# authentik 2026.8.x splits the flow UI into ~60-80 chunk files, so a fresh
# browser (incognito, first visit, outpost redirect chain) fires the whole
# bundle in one burst. The old avg10/burst20 values 429'd chunks mid-load and
# broke login entirely (Sep 8 incident: cached browsers worked, fresh ones
# spun forever). 30/10s sustained still blunts credential stuffing hard.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-rate-limit
  namespace: dmz
  annotations:
    argocd.argoproj.io/tracking-id: dmz-ingress-routes:traefik.io/Middleware:dmz/authentik-rate-limit
spec:
  rateLimit:
    average: 30
    period: 10s
    burst: 120