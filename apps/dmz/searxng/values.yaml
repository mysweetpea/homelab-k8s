controllers:
  main:
    containers:
      main:
        image:
          repository: searxng/searxng
          tag: 2026.8.28-a30b2d474
        env:
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: SEARXNG_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    type: deployment
configMaps:
  config:
    enabled: true
    data:
      settings.yml: |
        # MySweetPea SearXNG — curated settings (GitOps-managed)
        # Full docs: https://docs.searxng.org/admin/settings/
        use_default_settings: true

        engines:
          - name: brave
            disabled: true
          - name: duckduckgo
            disabled: true
          - name: startpage
            disabled: true
          - name: google cse
            disabled: true

        general:
          instance_name: "MySweetPea Search"

        server:
          base_url: "http://192.168.20.230:8080"
          image_proxy: true
          method: "GET"

        search:
          formats:
            - html
            - json
          autocomplete: "duckduckgo"
          favicon_resolver: "duckduckgo"
          safe_search: 0
          default_lang: "auto"

        ui:
          default_locale: "en"
          theme: "simple"
          default_theme: "simple"

        outgoing:
          request_timeout: 3.0
          pool_connections: 100
          pool_maxsize: 10
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
    - path: /etc/searxng/settings.yml
      subPath: settings.yml
      readOnly: true
  data:
    existingClaim: searxng-data-lh
    globalMounts:
    - path: /var/cache/searxng
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.230
    ports:
      http:
        port: 8080
