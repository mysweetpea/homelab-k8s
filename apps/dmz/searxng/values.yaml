controllers:
  main:
    containers:
      main:
        image:
          repository: searxng/searxng
          tag: 2026.8.28-a30b2d474
        env:
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: SEARXNG_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    type: deployment
configMaps:
  config:
    enabled: true
    data:
      settings.yml: |
        # MySweetPea SearXNG — curated settings (GitOps-managed)
        # Full docs: https://docs.searxng.org/admin/settings/
        use_default_settings:
          engines:
            keep_only:
              # general web (all support the site: operator)
              - google
              - bing
              - duckduckgo
              - brave
              - mojeek
              - qwant
              - yep
              - marginalia
              - mwmbl
              - sepiasearch
              - searchmysite
              - wiby
              - wikipedia
              - wiktionary
              # IT / code
              - github
              - github code
              - gitlab
              - codeberg
              - stackoverflow
              - superuser
              - askubuntu
              - hackernews
              - npm
              - pypi
              - crates.io
              - docker hub
              - mdn
              - mankier
              - lib.rs
              - pub.dev
              - rubygems
              - packagist
              # science
              - arxiv
              - pubmed
              - crossref
              - semantic scholar
              - openalex
              - springer nature
              - core.ac.uk
              # images
              - bing images
              - google images
              - duckduckgo images
              - brave.images
              - pixabay images
              - openverse
              - unsplash
              - wallhaven
              # videos
              - bing videos
              - duckduckgo videos
              - brave.videos
              - google videos
              - vimeo
              - dailymotion
              - peertube
              - odysee
              - rumble
              # news
              - bing news
              - duckduckgo news
              - google news
              - qwant news
              # music
              - bandcamp
              - soundcloud
              # map
              - openstreetmap
              - photon
              # social
              - lemmy posts
              - lemmy communities
              - mastodon hashtags
              - mastodon users
              # language / reference
              - dictzone
              - libretranslate
              - lingva
              - mymemory translated
              - wikicommons.images
              - wikicommons.videos

        general:
          instance_name: "MySweetPea Search"

        server:
          base_url: "http://192.168.20.230:8080"
          image_proxy: true
          method: "GET"

        search:
          formats:
            - html
            - json
          autocomplete: "duckduckgo"
          favicon_resolver: "duckduckgo"
          safe_search: 0
          default_lang: "auto"

        ui:
          default_locale: "en"
          theme: "simple"
          default_theme: "simple"

        outgoing:
          request_timeout: 3.0
          pool_connections: 100
          pool_maxsize: 10
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
    - path: /etc/searxng/settings.yml
      subPath: settings.yml
      readOnly: true
  data:
    existingClaim: searxng-data-lh
    globalMounts:
    - path: /var/cache/searxng
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.230
    ports:
      http:
        port: 8080
