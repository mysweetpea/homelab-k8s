controllers:
  main:
    containers:
      main:
        image:
          repository: ollama/ollama
          tag: 0.33.1
        env:
        - name: OLLAMA_MODELS
          value: /data/models
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
    type: deployment
persistence:
  data:
    accessMode: ReadWriteOnce
    enabled: true
    size: 20Gi
    storageClass: longhorn
    globalMounts:
    - path: /data
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.228
    ports:
      http:
        port: 11434
