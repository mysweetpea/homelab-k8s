controllers:
  main:
    containers:
      main:
        image:
          repository: ollama/ollama
          tag: 0.32.6
    type: deployment
persistence:
  data:
    accessMode: ReadWriteOnce
    enabled: true
    size: 20Gi
    storageClass: longhorn
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.20.228
    ports:
      http:
        port: 11434
