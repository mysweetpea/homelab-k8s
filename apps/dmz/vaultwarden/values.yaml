persistence:
  enabled: true
  existingClaim: vaultwarden
  size: 2Gi
  storageClass: longhorn

# MySweetPea login disclaimer: mount patched web-vault index.html
additionalVolumes:
  - name: web-index
    configMap:
      name: vaultwarden-web-index
additionalVolumeMounts:
  - name: web-index
    mountPath: /web-vault/index.html
    subPath: index.html
    readOnly: true

image:
  tag: "1.37.1"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

vaultwarden:
  domain: "https://vault.mysweetpea.cc"
  allowSignups: false
  # SSO-only: invitations create accounts outside Authentik
  allowInvitation: false
  admin:
    enabled: true
    existingSecret: "vaultwarden-admin"
  sso:
    enabled: true
    authority: "https://auth.mysweetpea.cc/application/o/vaultwarden/"
    scopes: "email profile offline_access"
    only: true
    signupsMatchEmail: true
    allowUnknownEmailVerification: false
    clientCacheExpiration: 0
    existingSecret: "vaultwarden-sso"
