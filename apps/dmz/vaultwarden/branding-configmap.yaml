apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-branding
  namespace: dmz
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: homelab
data:
  user.vaultwarden.scss.hbs: "/* ============================================================\n   MySweetPea branding \u2014 Vaultwarden web vault\n   Accent: teal #5EB8A8 (matches Jellyfin/Homepage/Authentik)\n   Logo: mysweetpea badge (mounted at /web-vault/images/)\n   ============================================================ */\n\n$logo-default: url('/images/mysweetpea-logo.png');\n$logo-admin:   url('/images/mysweetpea-logo.png');\n\n/* --- Teal accent (light theme) --- */\n.theme_light {\n  --color-brand-500: #5EB8A8;\n  --color-brand-600: #4AA394;\n  --color-primary-600: #5EB8A8;\n  --color-primary-700: #4AA394;\n}\n\n/* --- Teal accent (dark theme) --- */\n.theme_dark {\n  --color-brand-500: #5EB8A8;\n  --color-brand-600: #7ECFC0;\n  --color-primary-600: #5EB8A8;\n  --color-primary-700: #7ECFC0;\n}\n\n/* --- Loading screen --- */\napp-root img.new-logo-themed { content: $logo-default !important; }\n\n/* --- Login screen --- */\nauth-anon-layout bit-landing-header bit-svg > svg\
    \ { display: none !important; }\nauth-anon-layout bit-landing-header bit-svg::before {\n  display: block !important;\n  content: \"\" !important;\n  width: 100% !important;\n  height: 42px !important;\n  background: $logo-default no-repeat center left !important;\n  background-size: contain !important;\n}\n\n/* --- Dashboard sidebar --- */\nbit-nav-logo bit-svg > svg { display: none !important; }\nbit-nav-logo bit-svg::before {\n  display: block !important;\n  content: \"\" !important;\n  width: 100% !important;\n  height: 42px !important;\n  background-repeat: no-repeat !important;\n  background-size: auto 42px !important;\n  background-position: center left !important;\n}\napp-user-layout bit-nav-logo bit-svg::before { background-image: $logo-default !important; }\napp-organization-layout bit-nav-logo bit-svg::before { background-image: $logo-admin !important; }\n"
  email_header.hbs: "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns=\"http://www.w3.org/1999/xhtml\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n   <head>\n      <meta name=\"viewport\" content=\"width=device-width\" />\n      <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\" />\n      <title>MySweetPea Vault</title>\n   </head>\n   <body style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; height: 100%; line-height: 25px; width: 100% !important;\" bgcolor=\"#f6f6f6\">\n      <style type=\"text/css\">\n         body {\n         margin: 0;\n         font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n         box-sizing: border-box;\n\
    \         font-size: 16px;\n         color: #333;\n         line-height: 25px;\n         -webkit-font-smoothing: antialiased;\n         -webkit-text-size-adjust: none;\n         }\n         body * {\n         margin: 0;\n         font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n         box-sizing: border-box;\n         font-size: 16px;\n         color: #333;\n         line-height: 25px;\n         -webkit-font-smoothing: antialiased;\n         -webkit-text-size-adjust: none;\n         }\n         img {\n         max-width: 100%;\n         border: none;\n         }\n         body {\n         -webkit-font-smoothing: antialiased;\n         -webkit-text-size-adjust: none;\n         width: 100% !important;\n         height: 100%;\n         line-height: 25px;\n         }\n         body {\n         background-color: #f6f6f6;\n         }\n         @media only screen and (max-width: 600px) {\n         body {\n         padding: 0 !important;\n         }\n         .container {\n\
    \         padding: 0 !important;\n         width: 100% !important;\n         }\n         .container-table {\n         padding: 0 !important;\n         width: 100% !important;\n         }\n         .content {\n         padding: 0 0 10px 0 !important;\n         }\n         .content-wrap {\n         padding: 10px !important;\n         }\n         .invoice {\n         width: 100% !important;\n         }\n         .main {\n         border-right: none !important;\n         border-left: none !important;\n         border-radius: 0 !important;\n         }\n         .logo {\n         padding-top: 10px !important;\n         }\n         .footer {\n         margin-top: 10px !important;\n         }\n         .indented {\n         padding-left: 10px;\n         }\n         }\n      </style>\n      <table class=\"body-wrap\" cellpadding=\"0\" cellspacing=\"0\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue',\
    \ Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0; width: 100%;\" bgcolor=\"#f6f6f6\">\n         <tr style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n            <td valign=\"middle\" class=\"aligncenter middle logo\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0; padding: 20px 0 10px;\" align=\"center\">\n                <img src=\"https://vault.mysweetpea.cc/images/mysweetpea-logo-email.png\" alt=\"MySweetPea Vault\" width=\"120\" height=\"120\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; border: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica,\
    \ Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0; max-width: 100%;\" />\n            </td>\n         </tr>\n         <tr style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n            <td class=\"container\" align=\"center\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; clear: both !important; color: #333; display: block !important; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0 auto; max-width: 600px !important; width: 600px;\" valign=\"top\">\n               <table cellpadding=\"0\" cellspacing=\"0\" class=\"container-table\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; clear: both !important; color: #333; display: block !important;\
    \ font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0 auto; max-width: 600px !important; width: max-content;\">\n                  <tr style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n                     <td class=\"content\" align=\"center\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; display: block; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0; line-height: 0; margin: 0 auto; max-width: 600px; padding-bottom: 20px;\" valign=\"top\">\n                        <table class=\"main\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 16px; color: #333; line-height:\
    \ 25px; -webkit-font-smoothing: antialiased; margin: 0; -webkit-text-size-adjust: none; border: 1px solid #e9e9e9; border-radius: 3px;\" bgcolor=\"white\">\n                           <tr style=\"margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 16px; color: #333; line-height: 25px; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none;\">\n                              <td class=\"content-wrap\" style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 16px; color: #333; line-height: 25px; margin: 0; -webkit-font-smoothing: antialiased; padding: 20px; -webkit-text-size-adjust: none;\" valign=\"top\">\n"
  email_footer.hbs: "                           </td>\n                        </tr>\n                        </table>\n                     </td>\n                  </tr>\n               </table>\n\n               <table class=\"footer\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; clear: both; color: #999; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 20px; margin: 0; width: 100%;\">\n                  <tr style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n                     <td class=\"aligncenter social-icons\" align=\"center\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #999; font-family: 'Helvetica\
    \ Neue', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 20px; margin: 0; padding: 5px 0 20px 0;\" valign=\"top\">\n                        <table cellpadding=\"0\" cellspacing=\"0\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0 auto;\">\n                           <tr style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 25px; margin: 0;\">\n                                 <td style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #999; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 20px; margin: 0; padding: 0 10px;\" valign=\"top\"><a href=\"https://mysweetpea.cc\"\
    \ target=\"_blank\" style=\"-webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; box-sizing: border-box; color: #999; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 20px; margin: 0; text-decoration: underline;\">MySweetPea</a></td>\n                           </tr>\n                        </table>\n                     </td>\n                  </tr>\n               </table>\n\n            </td>\n         </tr>\n      </table>\n   </body>\n</html>\n"
binaryData:
  mysweetpea-logo.png: 
  mysweetpea-logo-email.png: 
