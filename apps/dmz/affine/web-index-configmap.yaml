  selfhost.html: "<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=auto\">\n\n    <meta name=\"mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n\n    <title>AFFiNE</title>\n    <meta name=\"theme-color\" content=\"#fafafa\">\n    \n    <link rel=\"manifest\" href=\"/manifest.json\">\n    <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"/apple-touch-icon.png\">\n    <link rel=\"icon\" sizes=\"192x192\" href=\"/favicon-192.png\">\n    <link rel=\"shortcut icon\" href=\"/favicon.ico?v=2\">\n    <meta name=\"emotion-insertion-point\" content=\"\">\n    <meta property=\"description\" content=\"There can be more than Notion and Miro. AFFiNE is a next-gen knowledge base that brings planning, sorting and creating all together.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:url\" content=\"https://app.affine.pro/\">\n    <meta name=\"twitter:title\" content=\"AFFiNE: There can be more than Notion and Miro.\">\n    <meta name=\"twitter:description\" content=\"There can be more than Notion and Miro. AFFiNE is a next-gen knowledge base that brings planning, sorting and creating all together.\">\n    <meta name=\"twitter:site\" content=\"@AffineOfficial\">\n    <meta name=\"twitter:image\" content=\"https://affine.pro/og.jpeg\">\n    <meta property=\"og:title\" content=\"AFFiNE: There can be more than Notion and Miro.\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:description\" content=\"There can be more than Notion and Miro. AFFiNE is a next-gen knowledge base that brings planning, sorting and creating all together.\">\n    <meta property=\"og:url\" content=\"https://app.affine.pro/\">\n    <meta property=\"og:image\" content=\"https://affine.pro/og.jpeg\">\n  <meta content=\"true\" name=\"env:isSelfHosted\"><meta content=\"/\" name=\"env:publicPath\"><link href=\"/styles.f5f942c3.css\" rel=\"stylesheet\"><link href=\"/vendor.17dcb3b4.css\" rel=\"stylesheet\"></head>\n\n  <body>\n    <div id=\"app\" data-version=\"174ad9bc5\"></div>\n  \n\n<script src=\"/js/runtime.a9935c36.js\"></script><script src=\"/js/npm-rxjs.9b685f49.js\"></script><script src=\"/js/i18n.173b0e88.js\"></script><script src=\"/js/i18n-langs.i18n-completenesses.86dbf9a3.js\"></script><script src=\"/js/npm-blocksuite.313e7e54.js\"></script><script src=\"/js/npm-react.15b362b8.js\"></script><script src=\"/js/npm-jotai.6ac7cdfc.js\"></script><script src=\"/js/npm-emotion.cd028e0a.js\"></script><script src=\"/js/vendor.c588e9c8.js\"></script><script src=\"/js/index.8c695e75.js\"></script><div id=\"mysweetpea-login-disclaimer\" style=\"display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(16,16,16,0.94);color:rgba(255,255,255,0.85);text-align:center;padding:10px 18px;font-family:'Segoe UI','Helvetica Neue',sans-serif;font-size:13px;line-height:1.45;border-top:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(4px);\">Sign in with your MySweetPea account (Authentik SSO). Use the same username and password as Vaultwarden, AFFiNE, and the other services.</div><script>\n(function () {\n  function isLoginPage() {\n    var p = location.pathname.toLowerCase();\n    return p.indexOf('/sign-in') !== -1 || p.indexOf('/signin') !== -1 || p === '/';\n  }\n  function update() {\n    var el = document.getElementById('mysweetpea-login-disclaimer');\n    if (el) el.style.display = isLoginPage() ? 'block' : 'none';\n  }\n  update();\n  setInterval(update, 1500);\n})();\n</script></body></html>"
