controllers:
  main:
    initContainers:
      migrate:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - node ./scripts/self-host-predeploy.js
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      config-writer:
        image:
          repository: alpine
          tag: latest
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          cat > /root/.affine/config/config.json <<EOF
          {
            "server": {
              "name": "MySweetPea Notes",
              "externalUrl": "https://notes.mysweetpea.cc"
            },
            "auth": {
              "allowSignup": false
            },
            "flags": {
              "allowGuestDemoWorkspace": false
            },
            "copilot": {
              "enabled": true,
              "byok": {
                "enabled": true
              }
            },
            "mailer": {
              "SMTP.host": "smtp.resend.com",
              "SMTP.port": 587,
              "SMTP.username": "$MAILER_USER",
              "SMTP.password": "$MAILER_PASSWORD",
              "SMTP.sender": "MySweetPea Notes <notes@mysweetpea.cc>",
              "SMTP.name": "notes.mysweetpea.cc"
            },
            "oauth": {
              "providers": {
                "oidc": {
                  "clientId": "$OIDC_CLIENT_ID",
                  "clientSecret": "$OIDC_CLIENT_SECRET",
                  "issuer": "https://auth.mysweetpea.cc/application/o/affine/",
                  "allowPrivateNetwork": true,
                  "args": {
                    "scope": "openid email profile offline_access",
                    "claim_id": "preferred_username",
                    "claim_email": "email",
                    "claim_name": "name"
                  }
                }
              }
            }
          }
          EOF
        env:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-secret
        - name: MAILER_USER
          valueFrom:
            secretKeyRef:
              name: affine-smtp
              key: smtp-user
        - name: MAILER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: affine-smtp
              key: smtp-password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      patch-web-index:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        command:
        - node
        - -e
        - |
          const fs = require('fs');
          const html = fs.readFileSync('/app/static/selfhost.html', 'utf8');
          const disc = fs.readFileSync('/branding/disclaimer.html', 'utf8');
          const patched = html.replace('</body>', disc + '</body>');
          fs.writeFileSync('/web-index/selfhost.html', patched);
          if (!patched.includes('mysweetpea-login-disclaimer')) {
            console.error('disclaimer splice FAILED');
            process.exit(1);
          }
          console.log('disclaimer splice OK');
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    containers:
      main:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-b4c8548"
          pullPolicy: IfNotPresent
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_SERVER_HOST
          value: notes.mysweetpea.cc
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        - name: NODE_OPTIONS
          value: "--dns-result-order=ipv4first --require /root/.affine/config/affine-ua-patch.js"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        ports:
        - containerPort: 3010
          name: http
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 10
    pod:
      hostAliases:
      - ip: "104.21.44.229"
        hostnames:
        - auth.mysweetpea.cc
service:
  main:
    controller: main
    ports:
      http:
        port: 3010
ingress:
  main:
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
    - host: notes.mysweetpea.cc
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
    - path: /root/.affine/config
  uploads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
    - path: /root/.affine/storage
  web-index:
    type: emptyDir
    advancedMounts:
      main:
        main:
        - path: /app/static/selfhost.html
          subPath: selfhost.html
          readOnly: true
        patch-web-index:
        - path: /web-index
  branding:
    type: configMap
    name: affine-branding
    globalMounts:
    - path: /branding
      readOnly: true
    advancedMounts:
      main:
        main:
        - path: /app/static/favicon-36.png
          subPath: favicon-36.png
          readOnly: true
        - path: /app/static/favicon-48.png
          subPath: favicon-48.png
          readOnly: true
        - path: /app/static/favicon-72.png
          subPath: favicon-72.png
          readOnly: true
        - path: /app/static/favicon-96.png
          subPath: favicon-96.png
          readOnly: true
        - path: /app/static/favicon-144.png
          subPath: favicon-144.png
          readOnly: true
        - path: /app/static/favicon-192.png
          subPath: favicon-192.png
          readOnly: true
        - path: /app/static/manifest.json
          subPath: manifest.json
          readOnly: true
