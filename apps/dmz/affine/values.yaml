controllers:
  main:
    initContainers:
      migrate:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-174ad9b"
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - node ./scripts/self-host-predeploy.js
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
      config-writer:
        image:
          repository: alpine
          tag: latest
          pullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          cat > /root/.affine/config/config.json <<EOF
          {
            "auth": {
              "allowSignup": false
            },
            "flags": {
              "allowGuestDemoWorkspace": false
            },
            "oauth": {
              "providers": {
                "oidc": {
                  "clientId": "$OIDC_CLIENT_ID",
                  "clientSecret": "$OIDC_CLIENT_SECRET",
                  "issuer": "https://auth.mysweetpea.cc/application/o/affine/",
                  "allowPrivateNetwork": true,
                  "args": {
                    "scope": "openid email profile offline_access",
                    "claim_id": "preferred_username",
                    "claim_email": "email",
                    "claim_name": "name"
                  }
                }
              }
            }
          }
          EOF
        env:
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: oidc-client-secret
    containers:
      main:
        image:
          repository: ghcr.io/toeverything/affine
          tag: "stable-174ad9b"
          pullPolicy: IfNotPresent
        env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secrets
              key: database-url
        - name: REDIS_SERVER_HOST
          value: redis-affine-master.private.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-affine
              key: redis-password
        - name: AFFINE_SERVER_HOST
          value: notes.mysweetpea.cc
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: NODE_OPTIONS
          value: "--dns-result-order=ipv4first --require /root/.affine/config/affine-ua-patch.js"
        ports:
        - containerPort: 3010
          name: http
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ready
                port: 3010
              initialDelaySeconds: 10
    pod:
      hostAliases:
      - ip: "104.21.44.229"
        hostnames:
        - auth.mysweetpea.cc
service:
  main:
    controller: main
    ports:
      http:
        port: 3010
ingress:
  main:
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
    - host: notes.mysweetpea.cc
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: main
          port: http
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
    - path: /root/.affine/config
  uploads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
    - path: /root/.affine/storage
