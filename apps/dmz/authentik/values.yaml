# ─────────────────────────────────────────────────────────────────────────────
# Git-backed Blueprints (Session 31) — ACTIVE
#
# The blueprint ConfigMap is rendered via `additionalObjects` below (generated
# by build-configmap.py). The `authentik-blueprint-env` Secret supplies the
# AUTHENTIK_BP_* vars referenced by !Env tags in the blueprints.
#
# Workflow:
#   1. Edit the blueprint YAML files in apps/dmz/authentik/blueprints/
#   2. Run:  python3 apps/dmz/authentik/blueprints/build-configmap.py
#      -> paste the printed `additionalObjects:` block into this file.
#   3. Ensure the `authentik-blueprint-env` Secret has all AUTHENTIK_BP_* vars.
#   4. Sync the authentik Application.
#
blueprints:
  configMaps:
    - authentik-blueprints

global:
  envFrom:
    - secretRef:
        name: authentik-blueprint-env
# ─────────────────────────────────────────────────────────────────────────────

postgresql:
  enabled: true
  auth:
    username: authentik
    password: "authentik2026!"
    database: authentik
    existingSecret: authentik-postgresql
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
additionalObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authentik-blueprints
      namespace: dmz
    data:
      00-groups.yaml: |
        version: 1
        entries:
          - id: group-seedling
            model: authentik_core.group
            attrs:
              name: seedling
              is_superuser: false
          - id: group-sweetpea
            model: authentik_core.group
            attrs:
              name: sweetpea
              is_superuser: false
      01-providers.yaml: |
        version: 1
        entries:
          # ── Vaultwarden (OIDC) ──────────────────────────────────────────────
          - id: provider-vaultwarden
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: vaultwarden
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: IomC2F9mfPulTpE19LTm22AxdwyWwRkfDaKpLpMr
              client_secret: !Env AUTHENTIK_BP_VAULTWARDEN_CLIENT_SECRET
              redirect_uris: '["https://vault.mysweetpea.cc/identity/connect/oidc-signin"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - email
                - profile
                - offline_access
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'offline_access']]
        
          # ── AFFiNE (OIDC) ───────────────────────────────────────────────────
          - id: provider-affine
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: affine
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: wnWQaSxzyuafhDDzklANZlrFkUP0pb32GX5Tsurb
              client_secret: !Env AUTHENTIK_BP_AFFINE_CLIENT_SECRET
              redirect_uris: '["https://notes.mysweetpea.cc/oauth/callback"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - openid
                - email
                - profile
                - offline_access
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'offline_access']]
        
          # ── Matrix Synapse (OIDC) ───────────────────────────────────────────
          - id: provider-matrix-synapse
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: matrix-synapse
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: OOCZ9OYQ4NknTxzzT2MzZBzEXDBs1bYrgvootaaw
              client_secret: !Env AUTHENTIK_BP_MATRIX_SYNAPSE_CLIENT_SECRET
              redirect_uris: '["https://matrix.mysweetpea.cc/_synapse/client/oidc/callback"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - openid
                - email
                - profile
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
        
          # ── Open WebUI (OIDC) ───────────────────────────────────────────────
          - id: provider-open-webui
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: open-webui
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: !Env AUTHENTIK_BP_OPEN_WEBUI_CLIENT_ID
              client_secret: !Env AUTHENTIK_BP_OPEN_WEBUI_CLIENT_SECRET
              redirect_uris: '["https://chat.mysweetpea.cc/oauth/oidc/callback"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - openid
                - email
                - profile
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
        
          # ── Nextcloud (OIDC) ────────────────────────────────────────────────
          - id: provider-nextcloud
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: nextcloud
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: !Env AUTHENTIK_BP_NEXTCLOUD_CLIENT_ID
              client_secret: !Env AUTHENTIK_BP_NEXTCLOUD_CLIENT_SECRET
              redirect_uris: '["https://cloud.mysweetpea.cc/apps/user_oidc/callback"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - openid
                - email
                - profile
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
        
          # ── Immich (OIDC) ───────────────────────────────────────────────────
          - id: provider-immich
            model: authentik_providers_oauth2.oauth2provider
            attrs:
              name: immich
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              client_type: confidential
              client_id: !Env AUTHENTIK_BP_IMMICH_CLIENT_ID
              client_secret: !Env AUTHENTIK_BP_IMMICH_CLIENT_SECRET
              redirect_uris: '["https://photos.mysweetpea.cc/auth/login", "https://photos.mysweetpea.cc/user-settings", "app.immich:///oauth-callback"]'
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
              access_code_validity: minutes=5
              access_token_validity: minutes=10
              include_claims_in_id_token: true
              token_mode: per_provider
              sub_mode: hashed_user_id
              issuer_mode: per_provider
              supported_scopes:
                - openid
                - email
                - profile
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'openid']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
                - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]
        
          # ── Jellyfin (LDAP) ─────────────────────────────────────────────────
          - id: provider-jellyfin
            model: authentik_providers_ldap.ldapprovider
            attrs:
              name: jellyfin
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              base_dn: dc=mysweetpea,dc=cc
              search_group: ""
              search_mode: CACHED_QUERY
              bind_mode: CACHED_BIND
              mfa_support: false
              tls_server_name: authentik-ldap-outpost.dmz.svc.cluster.local
              certificate: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        
          # ── KoalaSync (Proxy / forward auth) ────────────────────────────────
          - id: provider-koalasync
            model: authentik_providers_proxy.proxyprovider
            attrs:
              name: koalasync
              authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
              external_host: https://sync.mysweetpea.cc
              mode: forward_single
              cookie_domain: mysweetpea.cc
              skip_path_regex: ""
              basic_auth_enabled: false
              intercept_header_auth: false
      02-applications.yaml: |
        version: 1
        entries:
          # ── Applications ────────────────────────────────────────────────────
          - id: app-vaultwarden
            model: authentik_core.application
            attrs:
              name: vaultwarden
              slug: vaultwarden
              launch_url: https://vault.mysweetpea.cc
              meta_launch_url: https://vault.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, vaultwarden]]
        
          - id: app-affine
            model: authentik_core.application
            attrs:
              name: affine
              slug: affine
              launch_url: https://notes.mysweetpea.cc
              meta_launch_url: https://notes.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, affine]]
        
          - id: app-matrix-synapse
            model: authentik_core.application
            attrs:
              name: matrix-synapse
              slug: matrix-synapse
              launch_url: https://matrix.mysweetpea.cc
              meta_launch_url: https://matrix.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, matrix-synapse]]
        
          - id: app-jellyfin
            model: authentik_core.application
            attrs:
              name: jellyfin
              slug: jellyfin
              launch_url: https://media.mysweetpea.cc
              meta_launch_url: https://media.mysweetpea.cc
              provider: !Find [authentik_providers_ldap.ldapprovider, [name, jellyfin]]
        
          - id: app-koalasync
            model: authentik_core.application
            attrs:
              name: koalasync
              slug: koalasync
              launch_url: https://sync.mysweetpea.cc
              meta_launch_url: https://sync.mysweetpea.cc
              provider: !Find [authentik_providers_proxy.proxyprovider, [name, koalasync]]
        
          - id: app-open-webui
            model: authentik_core.application
            attrs:
              name: open-webui
              slug: open-webui
              launch_url: https://chat.mysweetpea.cc
              meta_launch_url: https://chat.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, open-webui]]
        
          - id: app-nextcloud
            model: authentik_core.application
            attrs:
              name: nextcloud
              slug: nextcloud
              launch_url: https://cloud.mysweetpea.cc
              meta_launch_url: https://cloud.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, nextcloud]]
        
          - id: app-immich
            model: authentik_core.application
            attrs:
              name: immich
              slug: immich
              launch_url: https://photos.mysweetpea.cc
              meta_launch_url: https://photos.mysweetpea.cc
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, immich]]
      03-bindings.yaml: |
        version: 1
        entries:
          # ── Group Bindings (policy engine mode: ANY) ────────────────────────
          # seedling + sweetpea for most; sweetpea-only for Jellyfin.
        
          - id: binding-vaultwarden
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, vaultwarden]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-vaultwarden-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, vaultwarden]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          - id: binding-affine
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, affine]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-affine-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, affine]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          - id: binding-matrix-synapse
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, matrix-synapse]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-matrix-synapse-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, matrix-synapse]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          # Jellyfin — sweetpea only
          - id: binding-jellyfin
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, jellyfin]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 0
        
          - id: binding-koalasync
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, koalasync]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-koalasync-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, koalasync]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          # New apps — seedling + sweetpea
          - id: binding-open-webui
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, open-webui]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-open-webui-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, open-webui]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          - id: binding-nextcloud
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, nextcloud]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-nextcloud-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, nextcloud]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
        
          - id: binding-immich
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, immich]]
              group: !Find [authentik_core.group, [name, seedling]]
              order: 0
          - id: binding-immich-sweetpea
            model: authentik_policies_bindings.policybinding
            attrs:
              target: !Find [authentik_core.application, [slug, immich]]
              group: !Find [authentik_core.group, [name, sweetpea]]
              order: 1
      04-outposts.yaml: |
        version: 1
        entries:
          # ── Outposts ────────────────────────────────────────────────────────
          # LDAP outpost (Jellyfin) + Proxy outpost (KoalaSync forward auth).
          # Tokens are injected via !Env so they never land in Git. These must
          # MATCH the tokens in the sealed secrets used by the outpost Deployments:
          #   authentik-ldap-outpost-token  (dmz)
          #   authentik-proxy-outpost-token (private)
        
          - id: outpost-ldap
            model: authentik_outposts.outpost
            attrs:
              name: authentik-ldap-outpost
              type: ldap
              service_connection: ""
              token: !Env AUTHENTIK_BP_LDAP_OUTPOST_TOKEN
              protocol_providers:
                - !Find [authentik_providers_ldap.ldapprovider, [name, jellyfin]]
              config:
                authentik_host: http://authentik-server.dmz.svc.cluster.local:80
                authentik_host_browser: https://auth.mysweetpea.cc
                log_level: info
            state: created
        
          - id: outpost-proxy
            model: authentik_outposts.outpost
            attrs:
              name: authentik-proxy-outpost
              type: proxy
              service_connection: ""
              token: !Env AUTHENTIK_BP_PROXY_OUTPOST_TOKEN
              protocol_providers:
                - !Find [authentik_providers_proxy.proxyprovider, [name, koalasync]]
              config:
                authentik_host: http://authentik-server.dmz.svc.cluster.local:80
                authentik_host_browser: https://auth.mysweetpea.cc
                log_level: info
                cookie_domain: mysweetpea.cc
            state: created
