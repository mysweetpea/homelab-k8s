version: 1
entries:
  # ── Outposts ────────────────────────────────────────────────────────
  # LDAP outpost (Jellyfin) + Proxy outpost (KoalaSync forward auth).
  # Tokens are injected via !Env so they never land in Git. These must
  # MATCH the tokens in the sealed secrets used by the outpost Deployments:
  #   authentik-ldap-outpost-token  (dmz)
  #   authentik-proxy-outpost-token (private)

  - id: outpost-ldap
    model: authentik_outposts.outpost
    attrs:
      name: authentik-ldap-outpost
      type: ldap
      service_connection: ""
      token: !Env AUTHENTIK_BP_LDAP_OUTPOST_TOKEN
      protocol_providers:
        - !Find [authentik_providers_ldap.ldapprovider, [name, jellyfin]]
      config:
        authentik_host: http://authentik-server.dmz.svc.cluster.local:80
        authentik_host_browser: https://auth.mysweetpea.cc
        log_level: info
    state: created

  - id: outpost-proxy
    model: authentik_outposts.outpost
    attrs:
      name: authentik-proxy-outpost
      type: proxy
      service_connection: ""
      token: !Env AUTHENTIK_BP_PROXY_OUTPOST_TOKEN
      protocol_providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, koalasync]]
      config:
        authentik_host: http://authentik-server.dmz.svc.cluster.local:80
        authentik_host_browser: https://auth.mysweetpea.cc
        log_level: info
        cookie_domain: mysweetpea.cc
    state: created
