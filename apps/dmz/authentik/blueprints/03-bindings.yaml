version: 1
entries:
  # ── Group Bindings (policy engine mode: ANY) ────────────────────────
  # seedling + sweetpea for most; sweetpea-only for Jellyfin.

  - id: binding-vaultwarden
    model: authentik_policies_bindings.policybinding
    attrs:
      target: !Find [authentik_core.application, [slug, vaultwarden]]
      group: !Find [authentik_core.group, [name, seedling]]
      order: 0
  - id: binding-vaultwarden-sweetpea
    model: authentik_policies_bindings.policybinding
    attrs:
      target: !Find [authentik_core.application, [slug, vaultwarden]]
      group: !Find [authentik_core.group, [name, sweetpea]]
      order: 1

