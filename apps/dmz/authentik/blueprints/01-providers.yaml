        - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'email']]
        - !Find [authentik_providers_oauth2.scopemapping, [name, authentik default OAuth Mapping: OpenID 'profile']]

  # ── Jellyfin (LDAP) ─────────────────────────────────────────────────
  - id: provider-jellyfin
    model: authentik_providers_ldap.ldapprovider
    attrs:
      name: jellyfin
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      base_dn: dc=mysweetpea,dc=cc
      search_group: ""
      search_mode: CACHED_QUERY
      bind_mode: CACHED_BIND
      mfa_support: false
      tls_server_name: authentik-ldap-outpost.dmz.svc.cluster.local
      certificate: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ── KoalaSync (Proxy / forward auth) ────────────────────────────────
  - id: provider-koalasync
    model: authentik_providers_proxy.proxyprovider
    attrs:
      name: koalasync
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      external_host: https://sync.mysweetpea.cc
      mode: forward_single
      cookie_domain: mysweetpea.cc
      skip_path_regex: ""
      basic_auth_enabled: false
      intercept_header_auth: false
